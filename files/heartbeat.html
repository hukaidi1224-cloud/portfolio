];
                              
let mode='menu',levelIndex=0,level=null,player=null,monsters=[],keys={},mouse={x:VIEW_W/2,y:VIEW_H/2,down:false},last=0,viewA=0,tipTimer=0,blindFlash=0,levelStart=0,litTrace=[],animation=0,camera={x:0,y:0},interactState={point:-1,progress:0},explored=new Set(),tipFlags={},simTime=0,pulseClock=0,pulseAge=99,lastPulseT=null;
                              
function makeMonster(def){let p=def.path[0];

function showTip(t,s=2){tipEl.textContent=t;

function reset(){beginLevel(levelIndex)}
function rectHit(x,y,r){return level.walls.some(w=>x+r>w[0]&&x-r<w[0]+w[2]&&y+r>w[1]&&y-r<w[1]+w[3])||x-r<10||x+r>MAP_W-10||y-r<10||y+r>MAP_H-10;
                              }
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
                              
function inWind(p){let z=level.wind;
                              return !!z&&p.x>z[0]&&p.x<z[0]+z[2]&&p.y>z[1]&&p.y<z[1]+z[3]}
function inLamp(p){return level.lamps.some(l=>Math.hypot(p.x-l[0],p.y-l[1])<120)}
function sonar(h,wind=false){if(wind){if(h<=110)return{tier:0,spread:Math.PI,lines:0};
                              if(h<130)return{tier:1,spread:Math.PI/4,lines:0};
                              return{tier:2,spread:Math.PI/18,lines:3}}if(h<70)return{tier:0,spread:Math.PI,lines:0};
                              if(h<=110)return{tier:1,spread:Math.PI/4,lines:0};
                              return{tier:2,spread:Math.PI/18,lines:3}}
function hearInterval(h,wind=false){let n=h<70?Infinity:h>=130?.8:h>110?1.4:2.5;
                              return wind?n*2:n}
function segmentBlocked(ax,ay,bx,by){let steps=Math.ceil(Math.hypot(bx-ax,by-ay)/8);for(let i=1;i<steps;i++){let t=i/steps,x=ax+(bx-ax)*t,y=ay+(by-ay)*t;if(level.walls.some(w=>x>w[0]&&x<w[0]+w[2]&&y>w[1]&&y<w[1]+w[3]))return true}return false}
function firstWallHit(ax,ay,bx,by){let dx=bx-ax,dy=by-ay,best=null,bestT=Infinity;
                              for(let i=0;i<level.walls.length;i++){let w=level.walls[i],t0=0,t1=1;
                              for(let [p,q] of [[dx,w[0]-ax],[-dx,ax-(w[0]+w[2])],[dy,w[1]-ay],[-dy,ay-(w[1]+w[3])]]){if(Math.abs(p)<1e-9){if(q>0){t0=2;break}}else{let t=q/p;if(p>0)t0=Math.max(t0,t);else t1=Math.min(t1,t)}}
                              if(t0<=t1&&t0>=0&&t0<=1&&t0<bestT){bestT=t0;best={x:ax+dx*t0,y:ay+dy*t0,wall:i,active:true}}}
                              return best}
function visibleMonster(m){let lookX=mouse.x+camera.x,lookY=mouse.y+camera.y,ang=Math.atan2(m.y-player.y,m.x-player.x),look=Math.atan2(lookY-player.y,lookX-player.x);
                              let d=Math.abs(Math.atan2(Math.sin(ang-look),Math.cos(ang-look)));
                              return viewA>.15&&dist(player,m)<260&&d<35*Math.PI/180&&!segmentBlocked(player.x,player.y,m.x,m.y)}
const exploreKey=(x,y)=>Math.floor(x/GRID)+','+Math.floor(y/GRID);
function isExplored(x,y){return explored.has(exploreKey(x,y))}
function markExplored(){let look=Math.atan2(mouse.y+camera.y-player.y,mouse.x+camera.x-player.x),half=35*Math.PI/180,minX=Math.max(0,Math.floor((player.x-260)/GRID)),maxX=Math.min(MAP_W/GRID-1,Math.floor((player.x+260)/GRID)),minY=Math.max(0,Math.floor((player.y-260)/GRID)),maxY=Math.min(MAP_H/GRID-1,Math.floor((player.y+260)/GRID));for(let cy=minY;cy<=maxY;cy++)for(let cx=minX;cx<=maxX;cx++){let x=cx*GRID+GRID/2,y=cy*GRID+GRID/2,a=Math.atan2(y-player.y,x-player.x),delta=Math.abs(Math.atan2(Math.sin(a-look),Math.cos(a-look)));if(Math.hypot(x-player.x,y-player.y)<=260&&delta<=half&&!segmentBlocked(player.x,player.y,x,y))explored.add(cx+','+cy)}}
function setState(m,s){if(s==='chase'&&m.state!=='suspicious')return;
                              let previous=m.state;
                              m.state=s;
                              m.stateT=0;
                              m.calmT=0;
                              if(s==='confused')m.target=null;
                              if(s==='chase'){m.chaseT=4;m.veiled=false}
                              if(s==='suspicious'&&previous!=='suspicious'&&!tipFlags.amber){tipFlags.amber=true;tipFlags.amberCount++;showTip('琥珀光亮起——它察觉到你了。光在墙上，危险在那面墙后；屏息或拉开距离躲开它。',4)}
                              }
function mirrorTarget(p){if(levelIndex!==2||!level.mirrors)return p;
                              let best=null,bd=90;
                              for(let q of level.mirrors){let d=Math.abs(p.x-q[0]);
                              if(d<bd&&p.y>q[1]&&p.y<q[3]){bd=d;
                              best={x:2*q[0]-p.x,y:p.y,mirror:true}}}return best||p}
function cellBlocked(cx,cy){let x=cx*GRID+GRID/2,y=cy*GRID+GRID/2;return rectHit(x,y,12)}
function astar(sx,sy,tx,ty){let cols=Math.ceil(MAP_W/GRID),rows=Math.ceil(MAP_H/GRID),sc=[clamp(Math.floor(sx/GRID),0,cols-1),clamp(Math.floor(sy/GRID),0,rows-1)],tc=[clamp(Math.floor(tx/GRID),0,cols-1),clamp(Math.floor(ty/GRID),0,rows-1)],key=(x,y)=>x+','+y,open=[{x:sc[0],y:sc[1],g:0,f:0}],came=new Map(),cost=new Map([[key(...sc),0]]),seen=new Set();
 while(open.length){open.sort((a,b)=>a.f-b.f);let n=open.shift(),nk=key(n.x,n.y);if(seen.has(nk))continue;seen.add(nk);if(n.x===tc[0]&&n.y===tc[1]){let out=[];while(came.has(nk)){out.push({x:n.x*GRID+GRID/2,y:n.y*GRID+GRID/2});let p=came.get(nk);n={x:p[0],y:p[1]};nk=key(n.x,n.y)}return out.reverse()}for(let q of [[1,0],[-1,0],[0,1],[0,-1]]){let x=n.x+q[0],y=n.y+q[1],k=key(x,y);if(x<0||y<0||x>=cols||y>=rows||cellBlocked(x,y))continue;let g=n.g+1;if(g<(cost.get(k)??Infinity)){cost.set(k,g);came.set(k,[n.x,n.y]);open.push({x,y,g,f:g+Math.abs(x-tc[0])+Math.abs(y-tc[1])})}}}return[]}
function navigate(m,x,y,s,dt){let key=Math.round(x/20)+','+Math.round(y/20);m.navT-=dt;if(m.navT<=0||m.navKey!==key||!m.nav.length){m.nav=astar(m.x,m.y,x,y);m.navT=.5;m.navKey=key}let t=m.nav[0]||{x,y};if(Math.hypot(t.x-m.x,t.y-m.y)<8){m.nav.shift();t=m.nav[0]||{x,y}}moveM(m,t.x,t.y,s,dt)}
function heardNow(m){return player.heart>=70&&(m.stateT-m.lastHeard)<=hearInterval(player.heart,inWind(player))}
function beginSearch(m){m.state='search';m.stateT=0;m.searchI=0;m.searchWait=0;let tx=m.target?m.target.x:m.x,ty=m.target?m.target.y:m.y,a=Math.atan2(player.y-ty,player.x-tx);m.searchPoints=[{x:clamp(m.x+Math.cos(a+1.2)*80,30,MAP_W-30),y:clamp(m.y+Math.sin(a+1.2)*80,30,MAP_H-30)},{x:clamp(m.x+Math.cos(a-1.2)*80,30,MAP_W-30),y:clamp(m.y+Math.sin(a-1.2)*80,30,MAP_H-30)}]}
function updateMonster(m,dt){m.stateT+=dt;
                              m.cooldown=Math.max(0,m.cooldown-dt);
                              m.markerT=Math.max(0,m.markerT-dt);
                              let d=dist(player,m),initialState=m.state;
                               
 if((m.state==='patrol'||m.state==='listen'||m.state==='suspicious'||m.state==='search')&&(player.heart>=70||interactState.point>=0)){m.hearT-=dt;
                              let interval=hearInterval(Math.max(70,player.heart),inWind(player));
                              if(m.hearT<=0){let precision=sonar(player.heart,inWind(player));
                              let err=m.state==='suspicious'?55:precision.tier===1?55:precision.tier===2?12:0,ang=Math.random()*TAU;
                              let heard={x:player.x+Math.cos(ang)*err,y:player.y+Math.sin(ang)*err};
                              m.target=mirrorTarget(heard);
                              m.lastHeard=m.stateT;
                              m.hearT=interval;
                              m.markerT=.35;
                              if(m.state==='search'){setState(m,'suspicious')}else if(m.state!=='suspicious')setState(m,'listen')}}
 if((m.state==='patrol'||m.state==='listen')&&m.cooldown<=0&&d<260&&player.heart>=85){let ang=Math.random()*TAU;
                              m.target=mirrorTarget({x:player.x+Math.cos(ang)*55,y:player.y+Math.sin(ang)*55});
                              setState(m,'suspicious')}
 if(m.state==='suspicious'&&initialState==='suspicious'&&d<90&&player.heart>=100){player.heart=clamp(player.heart+25,0,160);
                              setState(m,'chase')}
 if(m.state==='patrol'){let t=m.path[m.pi],dd=Math.hypot(t[0]-m.x,t[1]-m.y);
                              if(dd<5)m.pi=(m.pi+1)%m.path.length;
                              else navigate(m,t[0],t[1],44,dt)}
 else if(m.state==='listen'){if(!m.target)setState(m,'confused');
                              else if(Math.hypot(m.target.x-m.x,m.target.y-m.y)<8)setState(m,'confused');
                              else navigate(m,m.target.x,m.target.y,PLAYER_SPEED*.5,dt)}
 else if(m.state==='suspicious'){if(d>320||player.heart<70)m.calmT+=dt;else m.calmT=0;
                              if(m.calmT>=3){m.cooldown=2;setState(m,'patrol')}
                              else if(m.target)navigate(m,m.target.x,m.target.y,PLAYER_SPEED*.6,dt)}
 else if(m.state==='chase'){m.chaseT-=dt;
                              navigate(m,player.x,player.y,PLAYER_SPEED*1.05,dt);
                              if(dist(player,m)<TOUCH)death();
                              else if(m.chaseT<=0){m.target=m.target||{x:player.x,y:player.y};beginSearch(m)}}
 else if(m.state==='search'){if(player.heart>=70&&m.hearT<=0){setState(m,'suspicious')}else{let t=m.searchPoints[m.searchI];if(!t){m.cooldown=3;setState(m,'patrol')}else if(Math.hypot(t.x-m.x,t.y-m.y)<12){m.searchWait+=dt;if(m.searchWait>=1){m.searchWait=0;m.searchI++}}else navigate(m,t.x,t.y,48,dt)}}
 else if(m.state==='confused'){if(player.heart>110){m.hearT=0;
                              setState(m,'patrol')}else if(m.stateT>=3)setState(m,'patrol')}
