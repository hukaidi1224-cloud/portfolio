<style>

const G = (path, speed=56) => ({path,speed});

/*

const LEVELS = [

  },

    walls:[...outerWalls(),R(290,52,24,310),R(290,500,24,348),R(560,190,24,480),R(850,52,24,330),R(850,520,24,328),R(1120,210,24,638),R(314,362,180,24),R(680,362,170,24),R(584,670,270,24)],
    water:[], altars:[{x:180,y:690},{x:1000,y:182}], wisps:[{x:420,y:680},{x:730,y:260},{x:1040,y:590}], rotators:[],
    ghosts:[G([[390,620],[485,620],[485,760],[390,760]],55),G([[680,220],[790,220],[790,320],[680,320]],58)],

  },
  {
    name:"第五进 · 灯山", start:{x:108,y:790}, goal:{x:1328,y:106}, oil:70, delay:.4,
    walls:[...outerWalls(),R(280,52,24,260),R(280,450,24,398),R(1128,52,24,360),R(1128,550,24,298),R(304,312,260,24),R(876,312,252,24),R(304,700,280,24),R(856,700,272,24)],
    water:[R(52,420,310,230)], altars:[{x:190,y:350}], wisps:[{x:980,y:620}],
    rotators:[{x:600,y:385,len:230,a:0,s:.42,lit:true},{x:840,y:385,len:230,a:1.57,s:-.36,lit:false},{x:600,y:590,len:220,a:.7,s:-.3,lit:false},{x:840,y:590,len:220,a:2.2,s:.34,lit:true}],

    notes:[{id:6,x:320,y:610},{id:7,x:1080,y:610}], stones:[{x:680,y:780},{x:970,y:650}], marks:[[150,760],[300,650],[520,620],[880,620],[1120,650],[1040,500],[850,450]], tutorial:[]

const $ = s => document.querySelector(s);
const canvas = $("#game");
const ctx = canvas.getContext("2d");
const ui = {
  menu:$("#menu"), hud:$("#hud"), note:$("#notePanel"), result:$("#resultPanel"),
  clear:$("#clearPanel"), archive:$("#archivePanel"), tip:$("#tip"), opening:$("#opening")
};
let dpr = 1;
let view = {s:1,x:0,y:0};
let state = null;
let paused = true;
let last = performance.now();
let tipTimer = 0;
let openingTimer = 0;
let keys = Object.create(null);
let mouse = {x:720,y:450};

function loadJSON(key, fallback){
  try { const v=localStorage.getItem(key); return v===null ? fallback : JSON.parse(v); }
  catch(_){ return fallback; }
}
function saveJSON(key, value){
  try { localStorage.setItem(key,JSON.stringify(value)); } catch(_){}
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function reduceMotion(){ return loadJSON(STORE.motion,false); }

function resize(){
  dpr = Math.max(1,window.devicePixelRatio||1);
  canvas.width = Math.round(innerWidth*dpr);
  canvas.height = Math.round(innerHeight*dpr);
  canvas.style.width = innerWidth+"px";
  canvas.style.height = innerHeight+"px";
  view.s = Math.min(innerWidth/W,innerHeight/H);
  view.x = (innerWidth-W*view.s)/2;
  view.y = (innerHeight-H*view.s)/2;
}

function freshGhost(spec){
  return {
    x:spec.path[0][0],y:spec.path[0][1],path:spec.path.map(p=>p.slice()),pi:1,
    speed:spec.speed,state:"patrol",timer:0,target:null,soundTarget:null,lockPlayer:false,
    seed:Math.random()*10,nearTimer:4,outlineTimer:0,lureLost:0,r:GHOST_R
  };
}

function resetLevel(index){
  const lv=LEVELS[index];
  state={
    level:index, player:{x:lv.start.x,y:lv.start.y,r:PLAYER_R}, elapsed:0,
    oil:lv.oil, lampOn:true, lampHeld:true, lamp:{x:lv.start.x,y:lv.start.y}, warned:false,
    stones:4, thrown:[], resting:[], ghosts:lv.ghosts.map(freshGhost), waves:[], echoes:[], ripples:[],
    pickups:lv.stones.map(p=>({...p,got:false})), notes:lv.notes.map(p=>({...p,got:false})),
    rotators:lv.rotators.map(p=>({...p})), fakeSegments:0, tapReady:0, howlReady:0,
    dead:false,won:false,moving:0,lastSound:null,clearEnding:null,goalCharge:0,goalHinted:false,finaleFlash:0,tutorialSeen:{}
  };
  paused=false; tipTimer=0; openingTimer=3.2; last=performance.now();
  ui.menu.classList.add("hidden");ui.clear.classList.add("hidden");ui.result.classList.add("hidden");ui.hud.classList.remove("hidden");
  ui.opening.textContent=OPENINGS[index];ui.opening.classList.remove("openingShow");void ui.opening.offsetWidth;ui.opening.classList.add("openingShow");
  syncHud();
}

function startGame(){ resetLevel(0); }

function rectHit(x,y,r,w){
  const nx=clamp(x,w.x,w.x+w.w),ny=clamp(y,w.y,w.y+w.h);
  return Math.hypot(x-nx,y-ny)<r;
}
function pointSegDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy||1;
  const t=clamp(((px-x1)*dx+(py-y1)*dy)/l2,0,1);
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function rotorEnds(r){
  const dx=Math.cos(r.a)*r.len/2,dy=Math.sin(r.a)*r.len/2;
  return [r.x-dx,r.y-dy,r.x+dx,r.y+dy];
}
function blocked(x,y,r=PLAYER_R){
  if(!state) return false;
  if(LEVELS[state.level].walls.some(w=>rectHit(x,y,r,w))) return true;
  return state.rotators.some(rot=>pointSegDist(x,y,...rotorEnds(rot))<r+6);
}
function lineBlocked(a,b){
  const d=dist(a,b),steps=Math.ceil(d/12);
  for(let i=1;i<steps;i++){
    const t=i/steps,x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;
    if(LEVELS[state.level].walls.some(w=>rectHit(x,y,2,w))) return true;
    if(state.rotators.some(rot=>pointSegDist(x,y,...rotorEnds(rot))<7)) return true;
  }
  return false;
}
function moveBody(body,dx,dy,r=body.r||PLAYER_R){
  if(!blocked(body.x+dx,body.y,r)) body.x+=dx;
  if(!blocked(body.x,body.y+dy,r)) body.y+=dy;
}

function lampPosition(){ return state.lampHeld ? state.player : state.lamp; }
function lightActive(){ return !!(state&&state.lampOn&&state.oil>0); }
function pointInPlayerLight(x,y){
  if(!lightActive()) return false;
  const p=lampPosition();
  return Math.hypot(x-p.x,y-p.y)<=LIGHT_RADIUS && !lineBlocked(p,{x,y});
}
function pointInDevelopLight(x,y){
  if(lightActive()&&Math.hypot(x-lampPosition().x,y-lampPosition().y)<=LIGHT_RADIUS) return true;
  for(const a of LEVELS[state.level].altars){
    if(Math.hypot(x-a.x,y-a.y)<=LIGHT_RADIUS) return true;
  }
  for(const r of state.rotators){
    if(r.lit && Math.hypot(x-r.x,y-r.y)<=LIGHT_RADIUS) return true;
  }
  return false;
}

function sampleRectEdges(w,space,out,max,src){
  const edges=[[w.x,w.y,w.x+w.w,w.y],[w.x+w.w,w.y,w.x+w.w,w.y+w.h],[w.x+w.w,w.y+w.h,w.x,w.y+w.h],[w.x,w.y+w.h,w.x,w.y]];
  edges.forEach(e=>{
    const len=Math.hypot(e[2]-e[0],e[3]-e[1]),n=Math.max(1,Math.ceil(len/space));
    for(let i=0;i<=n;i++){
      const t=i/n,x=e[0]+(e[2]-e[0])*t,y=e[1]+(e[3]-e[1])*t,d=Math.hypot(x-src.x,y-src.y);
      if(d<=max) out.push({x,y,d,shown:false,fake:false});
    }
  });
}
function sampleRotor(rot,space,out,max,src){
  const e=rotorEnds(rot),len=Math.hypot(e[2]-e[0],e[3]-e[1]),n=Math.max(2,Math.ceil(len/space));
  for(let i=0;i<=n;i++){
    const t=i/n,x=e[0]+(e[2]-e[0])*t,y=e[1]+(e[3]-e[1])*t,d=Math.hypot(x-src.x,y-src.y);
    if(d<=max)out.push({x,y,d,shown:false,fake:false});
  }
}
function addFakeEcho(wave,src){
  if(state.level!==4) return;
  const walls=LEVELS[4].walls.filter(w=>Math.hypot(w.x+w.w/2-src.x,w.y+w.h/2-src.y)<wave.max+160).slice(0,2);
  for(const w of walls){
    const vertical=w.h>w.w,offset=vertical?96:-96;
    for(let i=0;i<7;i++){
      const t=i/6,x=vertical?w.x+offset:w.x+t*w.w,y=vertical?w.y+t*w.h:w.y+offset;
      const d=Math.hypot(x-src.x,y-src.y);if(d<=wave.max)wave.reveals.push({x,y,d,shown:false,fake:true});
    }
    state.fakeSegments++;
  }
}
function emitSound(x,y,kind){
  if(!state||paused||state.dead||state.won) return false;
  const cfg=SOUND[kind];if(!cfg)return false;
  if(kind==="tap"&&state.elapsed<state.tapReady)return false;
  if(kind==="howl"&&state.elapsed<state.howlReady)return false;
  if(kind==="tap")state.tapReady=state.elapsed+cfg.cool;
  if(kind==="howl")state.howlReady=state.elapsed+cfg.cool;
  const reveals=[];
  LEVELS[state.level].walls.forEach(w=>sampleRectEdges(w,cfg.space,reveals,cfg.max,{x,y}));
  state.rotators.forEach(r=>sampleRotor(r,cfg.space,reveals,cfg.max,{x,y}));
  const wave={x,y,r:0,max:cfg.max,speed:420,age:0,kind,delay:LEVELS[state.level].delay,reveals};
  addFakeEcho(wave,{x,y});state.waves.push(wave);state.lastSound={kind,x,y};
  hearSound(x,y,cfg.listen);return true;
}

        if(blocked(x,y,7)){s.x=x-dx/(Math.hypot(dx,dy)||1)*10;s.y=y-dy/(Math.hypot(dx,dy)||1)*10;s.hit=true;s.t=1;emitSound(x,y,"stone");showTip("声石撞在墙上。",1.0);break;}
        if(i===steps){s.x=x;s.y=y;}

function updateGhosts(dt){

    g.outlineTimer=Math.max(0,g.outlineTimer-dt);
    if(g.state==="patrol"){
      if(canSeeLamp(g)){g.target={x:lamp.x,y:lamp.y};setGhostState(g,"lured");continue;}
      const t={x:g.path[g.pi][0],y:g.path[g.pi][1]};if(toward(g,t,g.speed,dt)<15)g.pi=(g.pi+1)%g.path.length;
      const d=dist(g,state.player);if(d<300){g.nearTimer-=dt;if(g.nearTimer<=0){state.ripples.push({x:g.x,y:g.y,born:state.elapsed,life:.34,near:true});g.nearTimer=4;}}else g.nearTimer=4;
    }else if(g.state==="lured"){
      if(canSeeLamp(g)){g.lureLost=0;g.target={x:lamp.x,y:lamp.y};if(dist(g,g.target)>24)toward(g,g.target,50,dt);}
      else{g.lureLost+=dt;if(g.lureLost>=2)setGhostState(g,"patrol");}

      if(g.timer<=0){setGhostState(g,"patrol");g.pi=(g.pi+1)%g.path.length;}
    }

  }
}

function drawObjects(t){
  const lv=LEVELS[state.level];
  for(const m of lv.marks){glow(m[0],m[1],18,"rgba(232,201,106,A)",.05);ctx.fillStyle="rgba(232,201,106,.16)";ctx.fillRect(m[0]-6,m[1]-1,12,2);}
  for(const p of state.pickups)if(!p.got){const a=.48+(reduceMotion()?0:Math.sin(t*2+p.x)*.12);glow(p.x,p.y,20,"rgba(220,211,188,A)",a*.26);ctx.fillStyle=`rgba(220,211,188,${a})`;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();}
  for(const s of state.resting){glow(s.x,s.y,18,"rgba(220,211,188,A)",.20);ctx.fillStyle="#bcb39c";ctx.beginPath();ctx.arc(s.x,s.y,3,0,7);ctx.fill();}
  for(const n of state.notes)if(!n.got){glow(n.x,n.y,24,"rgba(232,201,106,A)",.28);ctx.save();ctx.translate(n.x,n.y);ctx.rotate(.42);ctx.fillStyle="#d4c6a2";ctx.fillRect(-5,-7,10,14);ctx.restore();}
  const goal=lv.goal;if(lv.finale){glow(goal.x,goal.y,60,"rgba(236,190,91,A)",.18);ctx.fillStyle="#e8c96a";ctx.beginPath();ctx.moveTo(goal.x,goal.y-17);ctx.quadraticCurveTo(goal.x-10,goal.y,goal.x,goal.y+9);ctx.quadraticCurveTo(goal.x+10,goal.y,goal.x,goal.y-17);ctx.fill();}else{glow(goal.x,goal.y,56,"rgba(119,164,210,A)",.18);ctx.fillStyle="#8eb7d7";ctx.beginPath();ctx.arc(goal.x,goal.y,6,0,7);ctx.fill();}
  for(const s of state.thrown){ctx.fillStyle="#d9c987";ctx.beginPath();ctx.arc(s.x,s.y,3,0,7);ctx.fill();}
}
function drawEchoes(){
  ctx.save();ctx.globalCompositeOperation="lighter";
  for(const p of state.echoes){const age=state.elapsed-p.born,a=Math.max(0,1-age/p.life);ctx.fillStyle=p.fake?`rgba(188,92,66,${a*.74})`:p.developed?`rgba(255,226,120,${Math.min(1,a*1.15)})`:`rgba(219,190,100,${a*.82})`;ctx.beginPath();ctx.arc(p.x,p.y,p.developed?3.4:2,0,7);ctx.fill();}
  for(const w of state.waves){if(w.delay&&w.age<w.delay)continue;circle(w.x,w.y,reduceMotion()?Math.min(w.r,46):w.r,"#d8bb64",.25*Math.max(0,1-w.r/w.max),1.2);}
  ctx.restore();
}
function drawLampLight(t){
  const self=state.player;glow(self.x,self.y,26,"rgba(238,215,160,A)",.10);
  if(!lightActive())return;const p=lampPosition(),flick=state.oil<25&&!reduceMotion()?.88+Math.sin(t*28)*.12:1;
  ctx.save();ctx.globalCompositeOperation="lighter";glow(p.x,p.y,LIGHT_RADIUS,"rgba(238,194,92,A)",.18*flick);ctx.restore();
  if(state.oil<25){const pulse=reduceMotion()?.045:.03+(Math.sin(t*5)+1)*.015;circle(p.x,p.y,LIGHT_RADIUS-2,"#9f4f35",pulse,2);}
  ctx.fillStyle="#e8c96a";ctx.beginPath();ctx.arc(p.x,p.y,state.lampHeld?5:7,0,7);ctx.fill();
  if(!state.lampHeld){ctx.strokeStyle="#7a633a";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y+4);ctx.lineTo(p.x,p.y+16);ctx.stroke();}
}
function drawGhosts(t){
  for(const r of state.ripples){const phase=(state.elapsed-r.born)/r.life;if(phase<0||phase>1)continue;if(r.developed){circle(r.x,r.y,reduceMotion()?34:8+phase*26,"#e8c96a",.5*(1-phase),1.4);continue;}const radius=r.near?60:reduceMotion()?100:30+phase*150;circle(r.x,r.y,radius,r.lured?"#d1a657":"#a12b24",(r.near?.13:r.weak?.28:.62)*(1-phase),1.5);}
  for(const g of state.ghosts){
    const visible=pointInPlayerLight(g.x,g.y)||g.state==="chase"||g.outlineTimer>0;
    if(g.state==="lured"){const phase=(state.elapsed+g.seed)%1;circle(g.x,g.y,reduceMotion()?34:18+phase*30,"#d1a657",.28*(1-phase),1.2);}
    if(g.state==="chase"){const phase=(state.elapsed+g.seed)%0.6/0.6;circle(g.x,g.y,reduceMotion()?42:10+phase*45,"#b22c26",.5*(1-phase),1.5);}
    if(visible){ctx.save();ctx.globalAlpha=g.state==="lured"?.62:.85;ctx.strokeStyle=g.state==="lured"?"#d3b26c":"#8d2a26";ctx.lineWidth=4;ctx.beginPath();ctx.arc(g.x,g.y,13,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(g.x-8,g.y+10);ctx.quadraticCurveTo(g.x,g.y+24,g.x+8,g.y+10);ctx.stroke();ctx.restore();}
  }
}
function dangerInfo(){
  if(!state||!state.ghosts.length)return{distance:Infinity,alpha:0,interval:1.2};const distance=Math.min(...state.ghosts.map(g=>dist(g,state.player))),alpha=distance<220?(220-distance)/220*.34:0,interval=distance<100?.5:distance<220?.5+(distance-100)/120*.7:1.2;return{distance,alpha,interval};
}
function drawPlayerDanger(){
  const d=dangerInfo();if(d.alpha<=0)return;const grad=ctx.createRadialGradient(W/2,H/2,220,W/2,H/2,820);grad.addColorStop(.55,"rgba(60,0,0,0)");grad.addColorStop(1,`rgba(90,8,8,${d.alpha})`);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);const phase=state.elapsed%d.interval/d.interval;circle(state.player.x,state.player.y,reduceMotion()?62:38+phase*52,"#8d2420",.2*(1-phase),1.1);
}
function drawFinaleProgress(){
  if(state.level!==5||state.goalCharge<=0||state.finaleFlash>0)return;const phase=clamp(state.goalCharge/2.4,0,1),radius=reduceMotion()?28:56*(1-phase);circle(state.player.x,state.player.y,Math.max(2,radius),"#e8c96a",.72,2.2);
}
function drawFinaleFlash(){
  if(state.finaleFlash<=0)return;ctx.save();ctx.globalAlpha=state.finaleFlash/.4;ctx.fillStyle="#fff8dc";ctx.fillRect(0,0,W,H);ctx.restore();
}
function drawWorld(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#020203";ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.setTransform(view.s*dpr,0,0,view.s*dpr,view.x*dpr,view.y*dpr);ctx.fillStyle="#09090a";ctx.fillRect(0,0,W,H);if(!state)return;
  const lv=LEVELS[state.level];
  const vignette=ctx.createRadialGradient(W/2,H/2,170,W/2,H/2,850);vignette.addColorStop(0,"rgba(0,0,0,.1)");vignette.addColorStop(1,"rgba(0,0,0,.64)");ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
  drawAltars(lv,t);drawWisps(lv,t);drawObjects(t);drawLitWalls();drawEchoes();drawLampLight(t);drawGhosts(t);drawPlayerDanger();drawFinaleProgress();
  ctx.save();ctx.translate(state.player.x,state.player.y);ctx.fillStyle="#eee5ca";ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill();ctx.strokeStyle="rgba(238,229,202,.35)";ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.stroke();ctx.restore();
  drawFinaleFlash();
}
function frame(now){const dt=clamp((now-last)/1000||0,0,.033);last=now;update(dt);drawWorld(now/1000);requestAnimationFrame(frame);}
function screenToWorld(cx,cy){return{x:(cx-view.x)/view.s,y:(cy-view.y)/view.s};}

addEventListener("resize",resize);
addEventListener("keydown",e=>{
  keys[e.code]=true;if(!state||paused)return;
  if(e.code==="Space"){e.preventDefault();throwStone();}
  if(e.code==="KeyQ")pickupStone();
  if(e.code==="KeyF")toggleLamp();
  if(e.code==="KeyE")placeOrPickLamp();
});
addEventListener("keyup",e=>keys[e.code]=false);
canvas.addEventListener("mousemove",e=>mouse=screenToWorld(e.clientX,e.clientY));
canvas.addEventListener("mousedown",e=>{mouse=screenToWorld(e.clientX,e.clientY);if(e.button===0)emitSound(state?.player.x,state?.player.y,"tap");if(e.button===2)emitSound(state?.player.x,state?.player.y,"howl");});
canvas.addEventListener("contextmenu",e=>e.preventDefault());

$("#startBtn").onclick=startGame;
$("#resultBtn").onclick=nextResult;
$("#clearBtn").onclick=leaveClear;
$("#closeNote").onclick=()=>{ui.note.classList.add("hidden");paused=false;last=performance.now();};
$("#archiveBtn").onclick=()=>{const got=loadJSON(STORE.notes,[]);$("#archiveList").innerHTML=NOTE_TEXTS.map((n,i)=>got.includes(i)?`<p><b>${i+1}. ${NOTE_TITLES[i]}</b><br>${n}</p>`:`<p class="muted">${i+1}. 未拾得</p>`).join("");ui.archive.classList.remove("hidden");};
$("#closeArchive").onclick=()=>ui.archive.classList.add("hidden");
$("#motionBtn").onclick=()=>{saveJSON(STORE.motion,!reduceMotion());refreshMenu();};

/* Stable inspection hooks for the local acceptance harness. */
window.__lightEchoTest={
  constants:{W,H,WALL,PLAYER_SPEED,CHASE_SPEED,LIGHT_RADIUS,LIGHT_SENSE,OIL_MAX,OIL_DRAIN,ALTAR_RANGE,ALTAR_FILL},
  start:startGame,reset:resetLevel,step:update,emit:(kind,x,y)=>emitSound(x??state.player.x,y??state.player.y,kind),
  toggleLamp,placeOrPickLamp,throwStone,pickupStone,win:winLevel,lose,
  snapshot:()=>state?JSON.parse(JSON.stringify({...state,dpr,view,danger:dangerInfo()})):null,
  levelSpec:i=>JSON.parse(JSON.stringify(LEVELS[i??state.level])),
  walkable:(x,y,r=PLAYER_R)=>!blocked(x,y,r),teleport:(x,y)=>{state.player.x=x;state.player.y=y;},
  setMouse:(x,y)=>mouse={x,y},setGhost:(i,x,y)=>{state.ghosts[i].x=x;state.ghosts[i].y=y;},
  setGhostState:(i,next)=>setGhostState(state.ghosts[i],next),hear:(x,y,range)=>hearSound(x,y,range),
  setOil:v=>state.oil=clamp(v,0,OIL_MAX),setNotes:n=>saveJSON(STORE.notes,n),
  lightAt:(x,y)=>pointInDevelopLight(x,y),lampPosition,storage:STORE
};

resize();refreshMenu();requestAnimationFrame(frame);
})();
</script>
</body>
