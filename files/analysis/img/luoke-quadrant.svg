<svg xmlns="http://www.w3.org/2000/svg"
     width="1360"
     height="900"
     viewBox="-20 -20 1360 900">
<g id="n1:1" transform="translate(0, 0)"><g id="o1:1" transform="translate(0, 0)"><rect x="0" y="0" width="1320" height="860" fill="#ffffff" stroke="none" stroke-width="0" rx="0" ry="0"/></g><g id="a1:1" transform="translate(60, 26.705)"><text font-size="30" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="35.295"><tspan x="0" text-anchor="start">四种站位结果：速度 × 对抗结果</tspan></tspan></text></g><g id="a1:2" transform="translate(60, 78.3525)"><text font-size="15" font-family="Noto Sans SC" font-weight="normal" fill="#6b7280" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">任何一回合的场上局势都能归到四格之一；每一格对应一种精灵定位。</tspan></tspan></text></g><g id="o1:2" transform="translate(150, 170)"><rect x="0" y="0" width="430" height="280" fill="#e6f5ef" stroke="#059669" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:3" transform="translate(170, 185.6465)"><text font-size="19" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="22.354"><tspan x="0" text-anchor="start">快 + 能击杀</tspan></tspan></text></g><g id="a1:4" transform="translate(170, 221.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#059669" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">平地起跳型速攻手</tspan></tspan></text></g><g id="a1:5" transform="translate(170, 257.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">上场首回合就爆发，先出手且一击决定伤害。</tspan></tspan></text></g><g id="c1:1" transform="translate(170, 388)"><path fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="4 4" d="M 0 0 L 390 0"/></g><g id="a1:6" transform="translate(170, 399.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">代表：音速犬：登场首回合技能伤害翻倍</tspan></tspan></text></g><g id="o1:3" transform="translate(580, 170)"><rect x="0" y="0" width="430" height="280" fill="#e8f1fd" stroke="#2563eb" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:7" transform="translate(600, 185.6465)"><text font-size="19" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="22.354"><tspan x="0" text-anchor="start">快 + 打不死且扛不住</tspan></tspan></text></g><g id="a1:8" transform="translate(600, 221.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#2563eb" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">干扰与功能位</tspan></tspan></text></g><g id="a1:9" transform="translate(600, 257.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">先完成一个任务再离场：挂状态、降能力，做完就切走。</tspan></tspan></text></g><g id="c1:2" transform="translate(600, 388)"><path fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 4" d="M 0 0 L 390 0"/></g><g id="a1:10" transform="translate(600, 399.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">代表：荆棘电环／卡瓦重／雪影／兽花蕾萌</tspan></tspan></text></g><g id="o1:4" transform="translate(150, 450)"><rect x="0" y="0" width="430" height="280" fill="#f0ecfe" stroke="#7c3aed" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:11" transform="translate(170, 465.6465)"><text font-size="19" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="22.354"><tspan x="0" text-anchor="start">慢 + 能扛住</tspan></tspan></text></g><g id="a1:12" transform="translate(170, 501.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#7c3aed" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">后手大核或联防位</tspan></tspan></text></g><g id="a1:13" transform="translate(170, 537.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">吃得住对方攻击，速度慢反而形成后手出手；也能顶住一波</tspan></tspan></text></g><g id="a1:14" transform="translate(170, 558.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">强化。</tspan></tspan></text></g><g id="c1:3" transform="translate(170, 668)"><path fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 4" d="M 0 0 L 390 0"/></g><g id="a1:15" transform="translate(170, 679.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">代表：圣剑X／巨骨象／水灵</tspan></tspan></text></g><g id="o1:5" transform="translate(580, 450)"><rect x="0" y="0" width="430" height="280" fill="#fdeaea" stroke="#dc2626" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:16" transform="translate(600, 465.6465)"><text font-size="19" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="22.354"><tspan x="0" text-anchor="start">慢 + 扛不住</tspan></tspan></text></g><g id="a1:17" transform="translate(600, 501.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#dc2626" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">催生迅捷与多命机制</tspan></tspan></text></g><g id="a1:18" transform="translate(600, 537.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">切上来先挨打又吃不住，于是用机制抹掉代价，或干脆主动</tspan></tspan></text></g><g id="a1:19" transform="translate(600, 558.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">卖掉。</tspan></tspan></text></g><g id="c1:4" transform="translate(600, 668)"><path fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" d="M 0 0 L 390 0"/></g><g id="a1:20" transform="translate(600, 679.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">代表：化蝶：三条命换清强化与挂状态</tspan></tspan></text></g><g id="a1:21" transform="translate(509, 131.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#6b7280" text-anchor="end" dominant-baseline="alphabetic" x="61"><tspan x="61" y="16.471"><tspan x="1.86" text-anchor="start">速度快 →</tspan></tspan></text></g><g id="a1:22" transform="translate(88, 177.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#6b7280" text-anchor="end" dominant-baseline="alphabetic" x="42"><tspan x="42" y="16.471"><tspan x="0" text-anchor="start">能扛住</tspan></tspan></text></g><g id="a1:23" transform="translate(88, 457.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#6b7280" text-anchor="end" dominant-baseline="alphabetic" x="42"><tspan x="42" y="16.471"><tspan x="0" text-anchor="start">扛不住</tspan></tspan></text></g><g id="o1:6" transform="translate(1050, 170)"><rect x="0" y="0" width="270" height="250" fill="#e6f5ef" stroke="#059669" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:24" transform="translate(1066, 179.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">迅捷</tspan></tspan></text></g><g id="a1:25" transform="translate(1066, 205.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">切换不亏回合，甚至拿到先手；把</tspan></tspan></text></g><g id="a1:26" transform="translate(1066, 226.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">第四格的劣势部分抹掉。代价是脆</tspan></tspan></text></g><g id="a1:27" transform="translate(1066, 247.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">、输出窗口短、绑定机制。</tspan></tspan></text></g><g id="o1:7" transform="translate(1050, 440)"><rect x="0" y="0" width="270" height="290" fill="#fdf1e3" stroke="#d97706" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:28" transform="translate(1066, 449.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">入场收益</tspan></tspan></text></g><g id="a1:29" transform="translate(1066, 475.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">雪影上场挂冰冻，兽花蕾萌入场降</tspan></tspan></text></g><g id="a1:30" transform="translate(1066, 496.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">对方双攻，巨骨象「齿轮扭矩」入</tspan></tspan></text></g><g id="a1:31" transform="translate(1066, 517.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">场即触发传动叠伤。轮转本身就是</tspan></tspan></text></g><g id="a1:32" transform="translate(1066, 538.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">输出，切换对它们是正收益，数值</tspan></tspan></text></g><g id="a1:33" transform="translate(1066, 559.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">必须严格控制。</tspan></tspan></text></g></g>
</svg>