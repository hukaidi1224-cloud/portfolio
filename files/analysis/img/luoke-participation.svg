<svg xmlns="http://www.w3.org/2000/svg"
     width="1660"
     height="920"
     viewBox="-20 -20 1660 920">
<g id="n1:1" transform="translate(0, 0)"><g id="o1:1" transform="translate(0, 0)"><rect x="0" y="0" width="1620" height="880" fill="#ffffff" stroke="none" stroke-width="0" rx="0" ry="0"/></g><g id="a1:1" transform="translate(60, 26.705)"><text font-size="30" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="35.295"><tspan x="0" text-anchor="start">参与阻力、现在的两条解法，与解法自带的代价</tspan></tspan></text></g><g id="a1:2" transform="translate(60, 78.3525)"><text font-size="15" font-family="Noto Sans SC" font-weight="normal" fill="#6b7280" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">左边是玩家为什么不进场，中间是系统怎么缩短思考链条，右边是这两条路各自带来的问题。</tspan></tspan></text></g><g id="a1:3" transform="translate(60, 130.823)"><text font-size="18" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="21.177"><tspan x="0" text-anchor="start">玩家为什么不进场（四步链）</tspan></tspan></text></g><g id="o1:2" transform="translate(60, 176)"><rect x="0" y="0" width="440" height="140" fill="#e8f1fd" stroke="#2563eb" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:4" transform="translate(76, 186.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">① 认知消耗</tspan></tspan></text></g><g id="a1:5" transform="translate(76, 210.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">每个回合都要猜对手、记配置、算伤害。决策要花认知资</tspan></tspan></text></g><g id="a1:6" transform="translate(76, 231.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">源，下班后这部分资源最紧缺。</tspan></tspan></text></g><g id="c1:1" transform="translate(280, 318)"><path fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 29"/></g><g id="d1:1" transform="translate(273.4, 344.5)"><defs><symbol id="svgicon-d1-1" viewBox="0 0 13.2 14"><g transform="translate(-273.4 -344.5)"><polygon points="280.0,356.0 275.9,347.0 284.1,347.0" fill="#2563EB" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-1" x="0" y="0" width="13.2" height="14"/></g><g id="o1:3" transform="translate(60, 356)"><rect x="0" y="0" width="440" height="140" fill="#f0ecfe" stroke="#7c3aed" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:7" transform="translate(76, 366.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">② 单局判断无法沉淀</tspan></tspan></text></g><g id="a1:8" transform="translate(76, 390.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">操作能练成肌肉记忆，多轮预测不能。每一局都是新题：</tspan></tspan></text></g><g id="a1:9" transform="translate(76, 411.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">往前追溯若干回合，往后预测若干回合。</tspan></tspan></text></g><g id="c1:2" transform="translate(280, 498)"><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 29"/></g><g id="d1:2" transform="translate(273.4, 524.5)"><defs><symbol id="svgicon-d1-2" viewBox="0 0 13.2 14"><g transform="translate(-273.4 -524.5)"><polygon points="280.0,536.0 275.9,527.0 284.1,527.0" fill="#7C3AED" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-2" x="0" y="0" width="13.2" height="14"/></g><g id="o1:4" transform="translate(60, 536)"><rect x="0" y="0" width="440" height="140" fill="#fdeaea" stroke="#dc2626" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:10" transform="translate(76, 546.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">③ 归因没有出口</tspan></tspan></text></g><g id="a1:11" transform="translate(76, 570.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">没有队友可推卸，也没有手速这种可直接比较的短板；被</tspan></tspan></text></g><g id="a1:12" transform="translate(76, 591.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">策略打败比被操作打败更伤自我评价。</tspan></tspan></text></g><g id="c1:3" transform="translate(280, 678)"><path fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 29"/></g><g id="d1:3" transform="translate(273.4, 704.5)"><defs><symbol id="svgicon-d1-3" viewBox="0 0 13.2 14"><g transform="translate(-273.4 -704.5)"><polygon points="280.0,716.0 275.9,707.0 284.1,707.0" fill="#DC2626" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-3" x="0" y="0" width="13.2" height="14"/></g><g id="o1:5" transform="translate(60, 716)"><rect x="0" y="0" width="440" height="140" fill="#fdf1e3" stroke="#d97706" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:13" transform="translate(76, 726.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">④ 一部分玩家不进场</tspan></tspan></text></g><g id="a1:14" transform="translate(76, 750.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">同样的时间花在失败归因更容易外推的内容上，更划算。</tspan></tspan></text></g><g id="a1:15" transform="translate(560, 130.823)"><text font-size="18" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="21.177"><tspan x="0" text-anchor="start">现在的两条解法：缩短博弈思考链条</tspan></tspan></text></g><g id="o1:6" transform="translate(560, 176)"><rect x="0" y="0" width="440" height="200" fill="#e6f5ef" stroke="#059669" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:16" transform="translate(576, 186.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">解法一：加快对局节奏</tspan></tspan></text></g><g id="a1:17" transform="translate(576, 210.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">强化类强度极高，一次成功的强化或爆破直接把优势兑现</tspan></tspan></text></g><g id="a1:18" transform="translate(576, 231.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">成一串推杀。代表设计：摔炮型爆破精灵、强化推队手。</tspan></tspan></text></g><g id="a1:19" transform="translate(576, 252.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">需要预测的回合数变少，单局认知投入下降。</tspan></tspan></text></g><g id="o1:7" transform="translate(560, 476)"><rect x="0" y="0" width="440" height="200" fill="#e6f5ef" stroke="#059669" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:20" transform="translate(576, 486.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">解法二：体系构建公式化</tspan></tspan></text></g><g id="a1:21" transform="translate(576, 510.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">配队重心从猜对手转到执行自己的任务链：什么时候上辅</tspan></tspan></text></g><g id="a1:22" transform="translate(576, 531.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">助、什么时候切联防位、什么时候让终端上场，都有可复</tspan></tspan></text></g><g id="a1:23" transform="translate(576, 552.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">用的顺序。给玩家可练习的路径感。</tspan></tspan></text></g><g id="c1:4" transform="translate(516, 400)"><path fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 19 0"/></g><g id="d1:4" transform="translate(532.5, 393.4)"><defs><symbol id="svgicon-d1-4" viewBox="0 0 14 13.2"><g transform="translate(-532.5 -393.4)"><polygon points="544.0,400.0 535.0,404.1 535.0,395.9" fill="#6B7280" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-4" x="0" y="0" width="14" height="13.2"/></g><g id="c1:5" transform="translate(1016, 400)"><path fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 19 0"/></g><g id="d1:5" transform="translate(1032.5, 393.4)"><defs><symbol id="svgicon-d1-5" viewBox="0 0 14 13.2"><g transform="translate(-1032.5 -393.4)"><polygon points="1044.0,400.0 1035.0,404.1 1035.0,395.9" fill="#6B7280" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-5" x="0" y="0" width="14" height="13.2"/></g><g id="a1:24" transform="translate(1060, 130.823)"><text font-size="18" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="21.177"><tspan x="0" text-anchor="start">共同的代价</tspan></tspan></text></g><g id="o1:8" transform="translate(1060, 176)"><rect x="0" y="0" width="440" height="200" fill="#fdeaea" stroke="#dc2626" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:25" transform="translate(1076, 186.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">两条路互相掣肘</tspan></tspan></text></g><g id="a1:26" transform="translate(1076, 210.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">加快节奏奖励高收益的即时决策，公式化奖励按部就班的</tspan></tspan></text></g><g id="a1:27" transform="translate(1076, 231.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">执行，两类玩家各有拥趸。平衡偏向一边，另一边体验受</tspan></tspan></text></g><g id="a1:28" transform="translate(1076, 252.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">损，于是每隔一两个赛季往复一轮。</tspan></tspan></text></g><g id="o1:9" transform="translate(1060, 376)"><rect x="0" y="0" width="440" height="200" fill="#fdf1e3" stroke="#d97706" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:29" transform="translate(1076, 386.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">慢节奏玩法被压缩</tspan></tspan></text></g><g id="a1:30" transform="translate(1076, 410.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">靠消耗、恢复、拉长对局取胜的取向，与「缩短对局」的</tspan></tspan></text></g><g id="a1:31" transform="translate(1076, 431.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">设计目标正面冲突，这部分玩家在环境里找不到能立足的</tspan></tspan></text></g><g id="a1:32" transform="translate(1076, 452.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">阵容。</tspan></tspan></text></g><g id="o1:10" transform="translate(1060, 576)"><rect x="0" y="0" width="440" height="200" fill="#f0ecfe" stroke="#7c3aed" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:33" transform="translate(1076, 586.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">失败压力反而增大</tspan></tspan></text></g><g id="a1:34" transform="translate(1076, 610.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">一次失误的影响被放大到后面很多回合，而这次失败可能</tspan></tspan></text></g><g id="a1:35" transform="translate(1076, 631.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">是前面若干回合累积的结果。要避开它，玩家必须往前追</tspan></tspan></text></g><g id="a1:36" transform="translate(1076, 652.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">溯更多回合、往后预测更多回合。</tspan></tspan></text></g></g>
</svg>