<svg xmlns="http://www.w3.org/2000/svg"
     width="1440"
     height="880"
     viewBox="-20 -20 1440 880">
<g id="n1:1" transform="translate(0, 0)"><g id="o1:1" transform="translate(0, 0)"><rect x="0" y="0" width="1400" height="840" fill="#ffffff" stroke="none" stroke-width="0" rx="0" ry="0"/></g><g id="a1:1" transform="translate(60, 26.705)"><text font-size="30" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="35.295"><tspan x="0" text-anchor="start">轴体：一只精灵在战场上要完成的任务链</tspan></tspan></text></g><g id="a1:2" transform="translate(60, 78.3525)"><text font-size="15" font-family="Noto Sans SC" font-weight="normal" fill="#6b7280" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">轴不是技能也不是数值，而是一套计划；任务链的长度决定它需要多少队友和多少格子。</tspan></tspan></text></g><g id="o1:2" transform="translate(60, 150)"><rect x="0" y="0" width="240" height="62" fill="#e8f1fd" stroke="#2563eb" stroke-width="1.2" rx="31" ry="31"/></g><g id="a1:3" transform="translate(136.5, 168.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="43.5"><tspan x="43.5" y="20.001"><tspan x="9.5" text-anchor="start">启动条件</tspan></tspan></text></g><g id="c1:1" transform="translate(306, 181)"><path fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 19 0"/></g><g id="d1:1" transform="translate(322.5, 174.4)"><defs><symbol id="svgicon-d1-1" viewBox="0 0 14 13.2"><g transform="translate(-322.5 -174.4)"><polygon points="334.0,181.0 325.0,185.1 325.0,176.9" fill="#2563EB" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-1" x="0" y="0" width="14" height="13.2"/></g><g id="o1:3" transform="translate(340, 150)"><rect x="0" y="0" width="240" height="62" fill="#e8f1fd" stroke="#2563eb" stroke-width="1.2" rx="31" ry="31"/></g><g id="a1:4" transform="translate(416.5, 168.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="43.5"><tspan x="43.5" y="20.001"><tspan x="9.5" text-anchor="start">核心动作</tspan></tspan></text></g><g id="c1:2" transform="translate(586, 181)"><path fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 19 0"/></g><g id="d1:2" transform="translate(602.5, 174.4)"><defs><symbol id="svgicon-d1-2" viewBox="0 0 14 13.2"><g transform="translate(-602.5 -174.4)"><polygon points="614.0,181.0 605.0,185.1 605.0,176.9" fill="#2563EB" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-2" x="0" y="0" width="14" height="13.2"/></g><g id="o1:4" transform="translate(620, 150)"><rect x="0" y="0" width="240" height="62" fill="#e8f1fd" stroke="#2563eb" stroke-width="1.2" rx="31" ry="31"/></g><g id="a1:5" transform="translate(686.5, 168.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="53.5"><tspan x="53.5" y="20.001"><tspan x="12.35" text-anchor="start">输出 / 控制</tspan></tspan></text></g><g id="c1:3" transform="translate(866, 181)"><path fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 19 0"/></g><g id="d1:3" transform="translate(882.5, 174.4)"><defs><symbol id="svgicon-d1-3" viewBox="0 0 14 13.2"><g transform="translate(-882.5 -174.4)"><polygon points="894.0,181.0 885.0,185.1 885.0,176.9" fill="#2563EB" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-3" x="0" y="0" width="14" height="13.2"/></g><g id="o1:5" transform="translate(900, 150)"><rect x="0" y="0" width="240" height="62" fill="#e8f1fd" stroke="#2563eb" stroke-width="1.2" rx="31" ry="31"/></g><g id="a1:6" transform="translate(997, 168.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="23"><tspan x="23" y="20.001"><tspan x="6" text-anchor="start">收尾</tspan></tspan></text></g><g id="o1:6" transform="translate(60, 250)"><rect x="0" y="0" width="615" height="170" fill="#e6f5ef" stroke="#059669" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:7" transform="translate(76, 259.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">小轴：音速犬（三步）</tspan></tspan></text></g><g id="a1:8" transform="translate(76, 285.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">上场 → 首回合爆发 → 切走。链条极短，所以可靠、不挑队友，任何队</tspan></tspan></text></g><g id="a1:9" transform="translate(76, 306.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">伍都能塞一只。轴体小本身就是一种强度。</tspan></tspan></text></g><g id="o1:7" transform="translate(60, 450)"><rect x="0" y="0" width="615" height="170" fill="#f0ecfe" stroke="#7c3aed" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:10" transform="translate(76, 459.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">大轴：恶魔狼（需要配合）</tspan></tspan></text></g><g id="a1:11" transform="translate(76, 485.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">挂在后台，等己方精灵不断击杀对手，以及主动送掉不重要的精灵来叠被</tspan></tspan></text></g><g id="a1:12" transform="translate(76, 506.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">动，成长起来之后接管比赛。链条长、风险大，需要队友为它争取时间。</tspan></tspan></text></g><g id="o1:8" transform="translate(60, 650)"><rect x="0" y="0" width="615" height="150" fill="#fdf1e3" stroke="#d97706" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:13" transform="translate(76, 659.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">跨精灵的轴</tspan></tspan></text></g><g id="a1:14" transform="translate(76, 685.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">雷暴双子：闪电鳗鱼给雷暴减费、星光狮给雷暴增伤甚至释放两次。虫队</tspan></tspan></text></g><g id="a1:15" transform="translate(76, 706.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">奉献轴：多只虫系铺资源，收割位收尾。</tspan></tspan></text></g><g id="a1:16" transform="translate(720, 224.823)"><text font-size="18" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="21.177"><tspan x="0" text-anchor="start">队伍只有六个格子：轴心占得越多，联防位越紧张</tspan></tspan></text></g><g id="a1:17" transform="translate(720, 291.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">小轴体系</tspan></tspan></text></g><g id="o1:9" transform="translate(720, 332)"><rect x="0" y="0" width="92" height="62" fill="#e6f5ef" stroke="#059669" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:18" transform="translate(752, 353.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="14"><tspan x="14" y="16.471"><tspan x="0" text-anchor="start">轴心</tspan></tspan></text></g><g id="o1:10" transform="translate(820, 332)"><rect x="0" y="0" width="92" height="62" fill="#fdf1e3" stroke="#d97706" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:19" transform="translate(852, 353.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="14"><tspan x="14" y="16.471"><tspan x="0" text-anchor="start">辅助</tspan></tspan></text></g><g id="o1:11" transform="translate(920, 332)"><rect x="0" y="0" width="92" height="62" fill="#e6f5ef" stroke="#059669" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:20" transform="translate(952, 353.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="14"><tspan x="14" y="16.471"><tspan x="0" text-anchor="start">联防</tspan></tspan></text></g><g id="o1:12" transform="translate(1020, 332)"><rect x="0" y="0" width="92" height="62" fill="#e6f5ef" stroke="#059669" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:21" transform="translate(1052, 353.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="14"><tspan x="14" y="16.471"><tspan x="0" text-anchor="start">联防</tspan></tspan></text></g><g id="o1:13" transform="translate(1120, 332)"><rect x="0" y="0" width="92" height="62" fill="#e6f5ef" stroke="#059669" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:22" transform="translate(1152, 353.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="14"><tspan x="14" y="16.471"><tspan x="0" text-anchor="start">联防</tspan></tspan></text></g><g id="o1:14" transform="translate(1220, 332)"><rect x="0" y="0" width="92" height="62" fill="#e6f5ef" stroke="#059669" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:23" transform="translate(1252, 353.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="14"><tspan x="14" y="16.471"><tspan x="0" text-anchor="start">联防</tspan></tspan></text></g><g id="a1:24" transform="translate(720, 409.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">轴心自己闭环，剩四格用来回答对手的问题，容错高。</tspan></tspan></text></g><g id="a1:25" transform="translate(720, 591.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">大轴体系</tspan></tspan></text></g><g id="o1:15" transform="translate(720, 632)"><rect x="0" y="0" width="92" height="62" fill="#f0ecfe" stroke="#7c3aed" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:26" transform="translate(752, 653.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="14"><tspan x="14" y="16.471"><tspan x="0" text-anchor="start">轴心</tspan></tspan></text></g><g id="o1:16" transform="translate(820, 632)"><rect x="0" y="0" width="92" height="62" fill="#f0ecfe" stroke="#7c3aed" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:27" transform="translate(852, 653.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="14"><tspan x="14" y="16.471"><tspan x="0" text-anchor="start">轴心</tspan></tspan></text></g><g id="o1:17" transform="translate(920, 632)"><rect x="0" y="0" width="92" height="62" fill="#f0ecfe" stroke="#7c3aed" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:28" transform="translate(952, 653.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="14"><tspan x="14" y="16.471"><tspan x="0" text-anchor="start">轴心</tspan></tspan></text></g><g id="o1:18" transform="translate(1020, 632)"><rect x="0" y="0" width="92" height="62" fill="#fdf1e3" stroke="#d97706" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:29" transform="translate(1052, 653.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="14"><tspan x="14" y="16.471"><tspan x="0" text-anchor="start">辅助</tspan></tspan></text></g><g id="o1:19" transform="translate(1120, 632)"><rect x="0" y="0" width="92" height="62" fill="#f0ecfe" stroke="#7c3aed" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:30" transform="translate(1152, 653.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="14"><tspan x="14" y="16.471"><tspan x="0" text-anchor="start">联防</tspan></tspan></text></g><g id="o1:20" transform="translate(1220, 632)"><rect x="0" y="0" width="92" height="62" fill="#f0ecfe" stroke="#7c3aed" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:31" transform="translate(1252, 653.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="14"><tspan x="14" y="16.471"><tspan x="0" text-anchor="start">联防</tspan></tspan></text></g><g id="a1:32" transform="translate(720, 709.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">轴心吃掉三格，联防只剩两个，被摸到弱点就很难翻。</tspan></tspan></text></g></g>
</svg>