<svg xmlns="http://www.w3.org/2000/svg"
     width="1420"
     height="940"
     viewBox="-20 -20 1420 940">
<g id="n1:2" transform="translate(0, 0)"><g id="o1:12" transform="translate(0, 0)"><rect x="0" y="0" width="1380" height="900" fill="#ffffff" stroke="none" stroke-width="0" rx="0" ry="0"/></g><g id="a1:24" transform="translate(60, 26.705)"><text font-size="30" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="35.295"><tspan x="0" text-anchor="start">洛克王国 PVP：规则从设计目标长出来的全过程</tspan></tspan></text></g><g id="a1:25" transform="translate(60, 78.3525)"><text font-size="15" font-family="Noto Sans SC" font-weight="normal" fill="#6b7280" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">每一层都在回答上一层提出的问题。左列＝设计侧（为什么这样定），右列＝系统侧（定下来长成什么）。</tspan></tspan></text></g><g id="o1:13" transform="translate(60, 140)"><rect x="0" y="0" width="580" height="118" fill="#e8f1fd" stroke="#2563eb" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:26" transform="translate(76, 149.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">① 沙箱假设</tspan></tspan></text></g><g id="a1:27" transform="translate(76, 175.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">n 只精灵对 n 只，先死完者负。清空到只剩两条规则时，玩家没有可选择的行为。</tspan></tspan></text></g><g id="c1:10" transform="translate(350, 260)"><path fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 17"/></g><g id="d1:10" transform="translate(343.4, 274.5)"><defs><symbol id="svgicon-d1-10" viewBox="0 0 13.2 14"><g transform="translate(-343.4 -274.5)"><polygon points="350.0,286.0 345.9,277.0 354.1,277.0" fill="#2563EB" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-10" x="0" y="0" width="13.2" height="14"/></g><g id="o1:14" transform="translate(60, 288)"><rect x="0" y="0" width="580" height="118" fill="#e8f1fd" stroke="#2563eb" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:28" transform="translate(76, 297.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">② 给玩家选择</tspan></tspan></text></g><g id="a1:29" transform="translate(76, 323.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">参与博弈 → 做出决策 → 影响结果 → 产生胜负。这条链是整套 PVP 的底层命题。</tspan></tspan></text></g><g id="c1:11" transform="translate(350, 408)"><path fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 17"/></g><g id="d1:11" transform="translate(343.4, 422.5)"><defs><symbol id="svgicon-d1-11" viewBox="0 0 13.2 14"><g transform="translate(-343.4 -422.5)"><polygon points="350.0,434.0 345.9,425.0 354.1,425.0" fill="#2563EB" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-11" x="0" y="0" width="13.2" height="14"/></g><g id="o1:15" transform="translate(60, 436)"><rect x="0" y="0" width="580" height="118" fill="#e6f5ef" stroke="#059669" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:30" transform="translate(76, 445.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">③ 体验目标</tspan></tspan></text></g><g id="a1:31" transform="translate(76, 471.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">核心是博弈快感（预判链一环套一环），伙伴情感是基调，画面表现是放大器。</tspan></tspan></text></g><g id="c1:12" transform="translate(350, 556)"><path fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 17"/></g><g id="d1:12" transform="translate(343.4, 570.5)"><defs><symbol id="svgicon-d1-12" viewBox="0 0 13.2 14"><g transform="translate(-343.4 -570.5)"><polygon points="350.0,582.0 345.9,573.0 354.1,573.0" fill="#059669" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-12" x="0" y="0" width="13.2" height="14"/></g><g id="o1:16" transform="translate(60, 584)"><rect x="0" y="0" width="580" height="118" fill="#fdeaea" stroke="#dc2626" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:32" transform="translate(76, 593.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">④ 会破坏体验的三种情形</tspan></tspan></text></g><g id="a1:33" transform="translate(76, 619.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">博弈对却输掉、猜对却拿不到奖励、一直猜错被平推——都指向「努力没有意义」。</tspan></tspan></text></g><g id="c1:13" transform="translate(350, 704)"><path fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 17"/></g><g id="d1:13" transform="translate(343.4, 718.5)"><defs><symbol id="svgicon-d1-13" viewBox="0 0 13.2 14"><g transform="translate(-343.4 -718.5)"><polygon points="350.0,730.0 345.9,721.0 354.1,721.0" fill="#DC2626" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-13" x="0" y="0" width="13.2" height="14"/></g><g id="o1:17" transform="translate(60, 732)"><rect x="0" y="0" width="580" height="118" fill="#fdf1e3" stroke="#d97706" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:34" transform="translate(76, 741.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">⑤ 商业目标</tspan></tspan></text></g><g id="a1:35" transform="translate(76, 767.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">让玩家愿意进来打（门槛低）、输了还想再来（失败损失小）。PVP 与 PVE 互相喂养。</tspan></tspan></text></g><g id="o1:18" transform="translate(740, 140)"><rect x="0" y="0" width="580" height="118" fill="#fdf1e3" stroke="#d97706" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:36" transform="translate(756, 149.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">⑥ 六条简化原则</tspan></tspan></text></g><g id="a1:37" transform="translate(756, 175.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">技能描述短、标注克制、博弈直观化、节奏快、失败损失小、减少恢复。</tspan></tspan></text></g><g id="c1:14" transform="translate(1030, 260)"><path fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 17"/></g><g id="d1:14" transform="translate(1023.5, 274.5)"><defs><symbol id="svgicon-d1-14" viewBox="0 0 13 14"><g transform="translate(-1023.5 -274.5)"><polygon points="1030.0,286.0 1026.0,277.0 1034.0,277.0" fill="#D97706" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-14" x="0" y="0" width="13" height="14"/></g><g id="o1:19" transform="translate(740, 288)"><rect x="0" y="0" width="580" height="118" fill="#f0ecfe" stroke="#7c3aed" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:38" transform="translate(756, 297.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">⑦ 博弈三角</tspan></tspan></text></g><g id="a1:39" transform="translate(756, 323.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">进攻克强化、强化克防御、防御克进攻。防御必须有代价，否则最优解是一直点防御。</tspan></tspan></text></g><g id="c1:15" transform="translate(1030, 408)"><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 17"/></g><g id="d1:15" transform="translate(1023.5, 422.5)"><defs><symbol id="svgicon-d1-15" viewBox="0 0 13 14"><g transform="translate(-1023.5 -422.5)"><polygon points="1030.0,434.0 1026.0,425.0 1034.0,425.0" fill="#7C3AED" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-15" x="0" y="0" width="13" height="14"/></g><g id="o1:20" transform="translate(740, 436)"><rect x="0" y="0" width="580" height="118" fill="#f0ecfe" stroke="#7c3aed" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:40" transform="translate(756, 445.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">⑧ 换人 · 速度 · 四种站位</tspan></tspan></text></g><g id="a1:41" transform="translate(756, 471.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">防御有冷却，换人成为必要动作；速度决定收益能否兑现；站位结果决定精灵定位。</tspan></tspan></text></g><g id="c1:16" transform="translate(1030, 556)"><path fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 17"/></g><g id="d1:16" transform="translate(1023.5, 570.5)"><defs><symbol id="svgicon-d1-16" viewBox="0 0 13 14"><g transform="translate(-1023.5 -570.5)"><polygon points="1030.0,582.0 1026.0,573.0 1034.0,573.0" fill="#7C3AED" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-16" x="0" y="0" width="13" height="14"/></g><g id="o1:21" transform="translate(740, 584)"><rect x="0" y="0" width="580" height="118" fill="#e6f5ef" stroke="#059669" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:42" transform="translate(756, 593.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">⑨ 轴体 · 战斗方式 · 精灵设计</tspan></tspan></text></g><g id="a1:43" transform="translate(756, 619.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">轴＝任务链，格子预算决定队伍灵活度；三种战斗方式反推精灵的需求与限制。</tspan></tspan></text></g><g id="c1:17" transform="translate(1030, 704)"><path fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 17"/></g><g id="d1:17" transform="translate(1023.5, 718.5)"><defs><symbol id="svgicon-d1-17" viewBox="0 0 13 14"><g transform="translate(-1023.5 -718.5)"><polygon points="1030.0,730.0 1026.0,721.0 1034.0,721.0" fill="#059669" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-17" x="0" y="0" width="13" height="14"/></g><g id="o1:22" transform="translate(740, 732)"><rect x="0" y="0" width="580" height="118" fill="#fdeaea" stroke="#dc2626" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:44" transform="translate(756, 741.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">⑩ 参与阻力与现在的解法</tspan></tspan></text></g><g id="a1:45" transform="translate(756, 767.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">四步链解释谁不进场；缩短思考链条的两条解法，各自把问题推到别处。</tspan></tspan></text></g><g id="c1:18" transform="translate(654, 207.9)"><path fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 583.1 L 70.9 0"/></g><g id="d1:18" transform="translate(718.4, 196.5)"><defs><symbol id="svgicon-d1-18" viewBox="0 0 13 14.4"><g transform="translate(-718.4 -196.5)"><polygon points="726.0,199.0 728.9,208.4 720.9,207.4" fill="#6B7280" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-18" x="0" y="0" width="13" height="14.4"/></g><g id="a1:46" transform="translate(658, 755.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#6b7280" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">推完回到玩家那侧检验</tspan></tspan></text></g></g>
</svg>