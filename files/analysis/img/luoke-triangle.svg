<svg xmlns="http://www.w3.org/2000/svg"
     width="1340"
     height="860"
     viewBox="-20 -20 1340 860">
<g id="n1:1" transform="translate(0, 0)"><g id="o1:1" transform="translate(0, 0)"><rect x="0" y="0" width="1300" height="820" fill="#ffffff" stroke="none" stroke-width="0" rx="0" ry="0"/></g><g id="a1:1" transform="translate(60, 26.705)"><text font-size="30" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="35.295"><tspan x="0" text-anchor="start">博弈三角，与防御的三项代价</tspan></tspan></text></g><g id="a1:2" transform="translate(60, 78.3525)"><text font-size="15" font-family="Noto Sans SC" font-weight="normal" fill="#6b7280" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="17.648"><tspan x="0" text-anchor="start">一个回合的三个基础选择构成闭环克制；防御一旦完美，闭环就塌掉。</tspan></tspan></text></g><g id="c1:1" transform="translate(330, 240)"><path fill="none" stroke="#dc2626" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 0"/></g><g id="o1:2" transform="translate(268, 210)"><rect x="0" y="0" width="124" height="60" fill="#fdeaea" stroke="#dc2626" stroke-width="1.2" rx="30" ry="30"/></g><g id="a1:3" transform="translate(301, 222.117)"><text font-size="22" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="29"><tspan x="29" y="25.883"><tspan x="7" text-anchor="start">进攻</tspan></tspan></text></g><g id="c1:2" transform="translate(165, 620)"><path fill="none" stroke="#2563eb" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 0"/></g><g id="o1:3" transform="translate(103, 590)"><rect x="0" y="0" width="124" height="60" fill="#e8f1fd" stroke="#2563eb" stroke-width="1.2" rx="30" ry="30"/></g><g id="a1:4" transform="translate(136, 602.117)"><text font-size="22" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="29"><tspan x="29" y="25.883"><tspan x="7" text-anchor="start">防御</tspan></tspan></text></g><g id="c1:3" transform="translate(500, 620)"><path fill="none" stroke="#d97706" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 0"/></g><g id="o1:4" transform="translate(438, 590)"><rect x="0" y="0" width="124" height="60" fill="#fdf1e3" stroke="#d97706" stroke-width="1.2" rx="30" ry="30"/></g><g id="a1:5" transform="translate(471, 602.117)"><text font-size="22" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="29"><tspan x="29" y="25.883"><tspan x="7" text-anchor="start">强化</tspan></tspan></text></g><g id="c1:4" transform="translate(360, 274)"><path fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 116.7 293.6"/></g><g id="d1:1" transform="translate(470.4, 563.6)"><defs><symbol id="svgicon-d1-1" viewBox="0 0 12.5 14.9"><g transform="translate(-470.4 -563.6)"><polygon points="480.0,576.0 472.9,569.1 480.4,566.1" fill="#D97706" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-1" x="0" y="0" width="12.5" height="14.9"/></g><g id="c1:5" transform="translate(236, 626)"><path fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 244 0 L 0 0"/></g><g id="d1:2" transform="translate(224.5, 619.5)"><defs><symbol id="svgicon-d1-2" viewBox="0 0 14 13"><g transform="translate(-224.5 -619.5)"><polygon points="227.0,626.0 236.0,622.0 236.0,630.0" fill="#2563EB" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-2" x="0" y="0" width="14" height="13"/></g><g id="c1:6" transform="translate(105, 283.6)"><path fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 296.4 L 192.1 0"/></g><g id="d1:3" transform="translate(291.2, 273.5)"><defs><symbol id="svgicon-d1-3" viewBox="0 0 13.3 14.8"><g transform="translate(-291.2 -273.5)"><polygon points="302.0,276.0 300.5,285.8 293.7,281.4" fill="#DC2626" font-family="Noto Sans SC" /></g></symbol></defs><use href="#svgicon-d1-3" x="0" y="0" width="13.3" height="14.8"/></g><g id="a1:6" transform="translate(407, 402.3525)"><text font-size="15" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="48"><tspan x="48" y="17.648"><tspan x="10.5" text-anchor="start">进攻克强化</tspan></tspan></text></g><g id="a1:7" transform="translate(396.5, 426.7055)"><text font-size="13" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="middle" dominant-baseline="alphabetic" x="58.5"><tspan x="58.5" y="15.295"><tspan x="0" text-anchor="start">强化不产生即时伤害</tspan></tspan></text></g><g id="a1:8" transform="translate(285, 642.3525)"><text font-size="15" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="48"><tspan x="48" y="17.648"><tspan x="10.5" text-anchor="start">强化克防御</tspan></tspan></text></g><g id="a1:9" transform="translate(274.5, 666.7055)"><text font-size="13" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="middle" dominant-baseline="alphabetic" x="58.5"><tspan x="58.5" y="15.295"><tspan x="0" text-anchor="start">强化后伤害突破减伤</tspan></tspan></text></g><g id="a1:10" transform="translate(142, 402.3525)"><text font-size="15" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="middle" dominant-baseline="alphabetic" x="48"><tspan x="48" y="17.648"><tspan x="10.5" text-anchor="start">防御克进攻</tspan></tspan></text></g><g id="a1:11" transform="translate(138, 426.7055)"><text font-size="13" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="middle" dominant-baseline="alphabetic" x="52"><tspan x="52" y="15.295"><tspan x="0" text-anchor="start">减伤稀释进攻收益</tspan></tspan></text></g><g id="o1:5" transform="translate(650, 130)"><rect x="0" y="0" width="590" height="150" fill="#fdeaea" stroke="#dc2626" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:12" transform="translate(666, 139.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">思想实验：如果防御是完美的</tspan></tspan></text></g><g id="a1:13" transform="translate(666, 165.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">不消耗能量、完全减伤、没有冷却——最优解是一直点防御。双方都这么做，</tspan></tspan></text></g><g id="a1:14" transform="translate(666, 186.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">十回合打不出伤害，对局无限拖长，与「随时开一把」的目标正面冲突。</tspan></tspan></text></g><g id="o1:6" transform="translate(650, 300)"><rect x="0" y="0" width="590" height="210" fill="#e8f1fd" stroke="#2563eb" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:15" transform="translate(666, 309.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">所以防御必须有三项代价</tspan></tspan></text></g><g id="a1:16" transform="translate(666, 335.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">消耗能量：每多防一次，能量池往下掉。</tspan></tspan></text></g><g id="a1:17" transform="translate(666, 356.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">减伤不完美：按对了防御，仍然会掉血。</tspan></tspan></text></g><g id="a1:18" transform="translate(666, 377.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">一回合冷却：防御不能连点。</tspan></tspan></text></g><g id="o1:7" transform="translate(650, 530)"><rect x="0" y="0" width="590" height="210" fill="#f0ecfe" stroke="#7c3aed" stroke-width="1.2" rx="8" ry="8"/></g><g id="a1:19" transform="translate(666, 539.9995)"><text font-size="17" font-family="Noto Sans SC" font-weight="bold" fill="#1f2937" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="20.001"><tspan x="0" text-anchor="start">冷却的真正威力</tspan></tspan></text></g><g id="a1:20" transform="translate(666, 565.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">你按了防御，对手知道你下回合没有防御可用——他进攻或强化都占优；</tspan></tspan></text></g><g id="a1:21" transform="translate(666, 586.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">他若强化，你可以用进攻压制强化；他为了防你的进攻，也得掏出防御。</tspan></tspan></text></g><g id="a1:22" transform="translate(666, 607.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#4b5563" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">三者互相牵扯，没有任何一个选择永远安全，必须混合策略。</tspan></tspan></text></g></g>
</svg>