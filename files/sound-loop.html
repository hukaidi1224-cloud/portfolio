<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>声音回路</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050506;color:#ded5be;font-family:"Songti SC","Noto Serif SC",serif}button{font:inherit}
  canvas{position:fixed;inset:0;width:100%;height:100%;background:#050506;cursor:crosshair}
  #hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 8px #000;letter-spacing:.12em}.top{display:flex;justify-content:space-between;padding:22px 28px;font-size:13px;color:#b8ae98}.controls{position:absolute;bottom:24px;left:28px;font-size:12px;line-height:1.9;color:#8f8878}.tip{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);max-width:650px;text-align:center;color:#e8c96a;font-size:14px;opacity:0;transition:opacity .35s}.tip.show{opacity:1}.state{position:absolute;right:28px;bottom:26px;text-align:right;font-size:12px;color:#a56158}
  .panel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,3,4,.88);padding:24px}.card{width:min(680px,92vw);border:1px solid #4d4433;background:#0a0a0c;padding:42px 46px;box-shadow:0 0 80px #000;text-align:center}.card h1{margin:0 0 10px;font-weight:400;letter-spacing:.32em;color:#f5f0e0}.card h2{font-weight:400;color:#e8c96a}.card p{line-height:2;color:#bdb49f}.card button,.ghost{pointer-events:auto;border:1px solid #716343;background:#15130f;color:#e8c96a;padding:10px 24px;margin:8px;cursor:pointer}.card button:hover,.ghost:hover{background:#262116}.small{font-size:12px;color:#7e786d!important}.hidden{display:none!important}
  .clear-stamp{display:inline-block;margin:22px 0 24px;padding:12px 18px 12px 24px;border:4px double #e8c96a;color:#e8c96a;font-size:22px;letter-spacing:.3em;transform:rotate(-4deg)}.clear-record{margin:5px 0!important;font-size:13px}.menu-clear{display:inline-block;margin:4px 0 18px;padding:5px 9px 5px 12px;border:3px double #8f7b45;color:#b9a25e;font-size:11px;letter-spacing:.16em;transform:rotate(-2deg)}
  #note .card{text-align:left}#note button{display:block;margin:24px auto 0}.archive-list{max-height:45vh;overflow:auto;text-align:left;border-top:1px solid #29251d}.archive-list p{border-bottom:1px solid #211f1a;padding:10px 4px;margin:0}.settings{position:fixed;top:54px;right:24px;pointer-events:auto}.settings button{font-size:11px;padding:6px 10px;background:#0d0d0f;border:1px solid #302c24;color:#8f8878}
</style>
</head>
<body>
<canvas id="game" aria-label="声音回路游戏画面"></canvas>
<div id="hud" class="hidden">
  <div class="top"><span id="levelName"></span><span id="timer"></span><span id="stones"></span></div>
  <div class="controls">WASD / 方向键　移动<br>左键　叩击　右键　长啸<br>空格　投声石（朝鼠标）　Q　拾声石</div>
  <div id="tip" class="tip"></div><div id="enemyState" class="state"></div>
  <div class="settings"><button id="motionBtn">减少动态：关</button></div>
</div>
<div id="menu" class="panel"><div class="card"><h1>声音回路</h1><p>发声即视之，发声即危之。</p><div id="menuClear" class="menu-clear hidden"></div><p class="small">戴上耳机也听不见。这里的声音，只用光来记账。</p><button id="startBtn">入灵堂</button><button id="archiveBtn">纸钱图鉴</button></div></div>
<div id="note" class="panel hidden"><div class="card"><h2 id="noteTitle"></h2><p id="noteText"></p><button id="closeNote">收起</button></div></div>
<div id="result" class="panel hidden"><div class="card"><h2 id="resultTitle"></h2><p id="resultText"></p><button id="resultBtn"></button></div></div>
<div id="clearPanel" class="panel hidden"><div class="card"><h2>守灵毕</h2><div class="clear-stamp">声债已清</div><p id="clearTimes" class="clear-record"></p><p id="clearNotes" class="clear-record"></p><p id="clearEnding" class="clear-record"></p><button id="clearBtn">回到门外</button></div></div>
<div id="archive" class="panel hidden"><div class="card"><h2>纸钱图鉴</h2><div id="archiveList" class="archive-list"></div><button id="closeArchive">返回</button></div></div>
<script>
(()=>{'use strict';
const W=1440,H=900,PLAYER_SPEED=130,CHASE_SPEED=PLAYER_SPEED*1.15;
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const $=s=>document.querySelector(s),ui={hud:$('#hud'),menu:$('#menu'),note:$('#note'),result:$('#result'),clear:$('#clearPanel'),archive:$('#archive'),level:$('#levelName'),timer:$('#timer'),stones:$('#stones'),tip:$('#tip'),enemy:$('#enemyState')};
const STORE={notes:'soundLoop.notes',best:'soundLoop.bestTimes',motion:'soundLoop.reduceMotion',cleared:'soundLoop.cleared'};
const NOTE_TEXTS=[
  '债从喉头借，也从脚底借。守灵的孩子不说话，院里便只剩下鬼在数。',
  '鬼不说话，你只能听自己的心跳。心跳快了，别回头，先屏住。等胸腔静下来，再问黑暗借路。',
  '水下的路比岸上安静，只是回声走得慢。眼前所见，原是旧一刻。',
  '前一个孩子把声石投进深水。鬼追着水纹去，他赤脚从背后走过。',
  '走马灯里的墙每夜换一回位置。只听一声的人，总会走进不存在的廊。',
  '祠堂灯下压着一张旧收据：借声六笔，还声无期。签名处留着小小指印。'
];
const OPENING=['叩门之前，先问黑暗借一声。','水记声慢。你见到的，是旧路。','灯墙替鬼撒谎。两声才算一眼。'];
const LEVELS=[makeLevel1(),makeLevel2(),makeLevel3()];
let dpr=1,view={s:1,x:0,y:0},keys={},mouse={x:W/2,y:H/2},last=0,state=null,tipTimer=0,paused=true;
function rect(x,y,w,h){return{x,y,w,h}}
function borders(extra=[]){return[rect(40,40,1360,24),rect(40,836,1360,24),rect(40,40,24,820),rect(1376,40,24,820),...extra]}
function makeLevel1(){return{name:'第一进·灵堂',delay:0,start:{x:110,y:770},goal:{x:1318,y:112},water:[],walls:borders([
 rect(340,40,24,190),rect(340,340,24,310),rect(340,750,24,110),rect(1076,40,24,300),rect(1076,450,24,410),
 rect(340,320,270,24),rect(730,320,370,24),rect(340,606,440,24),rect(900,606,200,24),rect(610,170,24,150),rect(820,606,24,150)
 ]),ghosts:[{x:720,y:470,path:[[720,470],[960,470],[960,720],[520,720],[520,470]]}],stones:[[190,650],[465,760],[790,540],[1160,520],[1220,220]],notes:[[250,420,0],[930,190,1]],marks:[[145,735],[190,690],[235,645],[285,600],[410,570],[535,540],[665,515],[805,470],[930,410],[1030,350],[1160,280],[1250,190]]};}
function makeLevel2(){return{name:'第二进·水患长廊',delay:1.5,start:{x:120,y:770},goal:{x:1320,y:110},water:[rect(82,82,270,736),rect(470,270,170,165)],walls:borders([
 rect(360,238,610,24),rect(1080,238,320,24),rect(40,443,170,24),rect(310,443,260,24),rect(680,443,510,24),rect(1300,443,100,24),
 rect(350,648,340,24),rect(800,648,600,24),rect(350,82,24,240),rect(350,420,24,228),rect(1180,443,24,225)
 ]),ghosts:[{x:850,y:340,path:[[850,340],[1100,340],[1100,160],[650,160]]},{x:770,y:740,path:[[770,740],[1240,740],[1240,570],[760,570]]}],stones:[[205,600],[285,310],[515,355],[870,545]],notes:[[245,150,2],[1260,605,3]],marks:[]};}
function makeLevel3(){return{name:'第三进·走马灯阵',delay:0,start:{x:110,y:790},goal:{x:720,y:450},water:[],walls:borders([
 rect(300,120,24,470),rect(300,700,24,160),rect(1116,40,24,220),rect(1116,370,24,490),
 rect(300,120,300,24),rect(720,120,420,24),rect(300,756,430,24),rect(850,756,290,24)
 ]),lamps:[{x:590,y:350,len:230,a:0,s:.22},{x:850,y:350,len:230,a:Math.PI/2,s:-.19},{x:590,y:570,len:230,a:Math.PI/2,s:.17},{x:850,y:570,len:230,a:0,s:-.24}],ghosts:[{x:470,y:240,path:[[470,240],[960,240],[960,670],[470,670]]},{x:990,y:610,path:[[990,610],[1060,700],[380,700],[380,180]]},{x:720,y:450,path:[[720,450],[820,450],[720,550],[620,450],[720,350]]}],stones:[[215,680],[410,430],[1020,690],[1240,320]],notes:[[430,210,4],[1010,505,5]],marks:[]};}
function loadJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function saveJSON(key,v){try{localStorage.setItem(key,JSON.stringify(v))}catch{}}
function resize(){dpr=Math.max(1,window.devicePixelRatio||1);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);view.s=Math.min(innerWidth/W,innerHeight/H);view.x=(innerWidth-W*view.s)/2;view.y=(innerHeight-H*view.s)/2;}
function resetLevel(index=0){const l=LEVELS[index];state={level:index,player:{x:l.start.x,y:l.start.y,r:9},stones:2,waves:[],echoes:[],eventRipples:[],thrown:[],resting:[],elapsed:0,moving:0,dead:false,won:false,notes:l.notes.map(n=>({x:n[0],y:n[1],id:n[2],got:false})),pickups:l.stones.map(p=>({x:p[0],y:p[1],got:false})),ghosts:l.ghosts.map((g,i)=>({x:g.x,y:g.y,r:13,state:'patrol',path:g.path,pi:1,target:null,timer:0,nearTimer:4,outlineTimer:0,seed:i*1.9})),lamps:(l.lamps||[]).map(x=>({...x})),fakeCount:0,lastSound:null};paused=false;last=performance.now();ui.level.textContent=l.name;showTip(OPENING[index],4);syncHud();}
function refreshClearMark(){const cleared=loadJSON(STORE.cleared,null),mark=$('#menuClear');mark.classList.toggle('hidden',!cleared);mark.textContent=cleared?`已通关 · ${cleared.ending==='receipt'?'收据':'灯下'}`:'';}
function startGame(){refreshClearMark();ui.menu.classList.add('hidden');ui.result.classList.add('hidden');ui.clear.classList.add('hidden');ui.hud.classList.remove('hidden');resetLevel(0);}
function showTip(text,seconds=2.4){ui.tip.textContent=text;ui.tip.classList.add('show');tipTimer=seconds;}
function syncHud(){if(!state)return;ui.stones.textContent=`声石 ${state.stones}/4　字条 ${loadJSON(STORE.notes,[]).length}/6`;ui.timer.textContent=formatTime(state.elapsed);ui.enemy.textContent=state.ghosts.map(g=>({patrol:'巡游',alert:'察觉',chase:'追猎',confused:'迷惑'}[g.state])).join(' · ');}
function formatTime(t){const m=Math.floor(t/60),s=Math.floor(t%60);return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function inRect(x,y,r,o){return x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h}
function pointSegDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/l)),x=x1+t*dx,y=y1+t*dy;return Math.hypot(px-x,py-y)}
function lampEnds(l){const dx=Math.cos(l.a)*l.len/2,dy=Math.sin(l.a)*l.len/2;return[l.x-dx,l.y-dy,l.x+dx,l.y+dy]}
function blocked(x,y,r){const lv=LEVELS[state.level];if(lv.walls.some(w=>inRect(x,y,r,w)))return true;return state.lamps.some(l=>{const e=lampEnds(l);return pointSegDist(x,y,...e)<r+8});}
function moveBody(b,dx,dy,r=b.r){if(!blocked(b.x+dx,b.y,r))b.x+=dx;if(!blocked(b.x,b.y+dy,r))b.y+=dy;}
function sampleRectEdges(w,spacing,out,max,source){const edges=[[w.x,w.y,w.x+w.w,w.y],[w.x+w.w,w.y,w.x+w.w,w.y+w.h],[w.x+w.w,w.y+w.h,w.x,w.y+w.h],[w.x,w.y+w.h,w.x,w.y]];for(const e of edges){const len=Math.hypot(e[2]-e[0],e[3]-e[1]),n=Math.max(1,Math.floor(len/spacing));for(let i=0;i<=n;i++){const t=i/n,x=e[0]+(e[2]-e[0])*t,y=e[1]+(e[3]-e[1])*t,d=Math.hypot(x-source.x,y-source.y);if(d<=max)out.push({x,y,d});}}}
function reflectSegment(source,e){const ax=e[2]-e[0],ay=e[3]-e[1],len=Math.hypot(ax,ay)||1,nx=-ay/len,ny=ax/len,side=(source.x-e[0])*nx+(source.y-e[1])*ny,off=Math.sign(side||1)*105;return{x1:e[0]-nx*off,y1:e[1]-ny*off,x2:e[2]-nx*off,y2:e[3]-ny*off};}
function emitSound(x,y,kind='tap',opts={}){if(!state||paused||state.dead||state.won)return false;const cfg={tap:{max:140,space:40,cool:.8,listen:200},howl:{max:340,space:14,cool:3,listen:300},foot:{max:60,space:46,cool:0,listen:100},stone:{max:140,space:40,cool:0,listen:200}}[kind];const now=state.elapsed;if((kind==='tap'&&now<(state.tapReady||0))||(kind==='howl'&&now<(state.howlReady||0)))return false;if(kind==='tap')state.tapReady=now+cfg.cool;if(kind==='howl')state.howlReady=now+cfg.cool;
 const reveals=[];LEVELS[state.level].walls.forEach(w=>sampleRectEdges(w,cfg.space,reveals,cfg.max,{x,y}));state.lamps.forEach(l=>{const e=lampEnds(l),len=Math.hypot(e[2]-e[0],e[3]-e[1]),n=Math.max(2,Math.floor(len/cfg.space));for(let i=0;i<=n;i++){const t=i/n,px=e[0]+(e[2]-e[0])*t,py=e[1]+(e[3]-e[1])*t,d=Math.hypot(px-x,py-y);if(d<=cfg.max)reveals.push({x:px,y:py,d});}});
 const wave={x,y,r:0,max:cfg.max,speed:420,age:0,kind,delay:LEVELS[state.level].delay,reveals:reveals.map(p=>({...p,shown:false,fake:false}))};
 if(state.level===2&&state.lamps.length){state.lamps.map(l=>({l,e:lampEnds(l),d:pointSegDist(x,y,...lampEnds(l))})).filter(o=>o.d<=cfg.max).sort((a,b)=>a.d-b.d).slice(0,2).forEach(o=>{const f=reflectSegment({x,y},o.e),len=Math.hypot(f.x2-f.x1,f.y2-f.y1),n=Math.min(8,Math.max(3,Math.floor(len/(cfg.space*1.4))));for(let i=0;i<=n;i++){const t=i/n,px=f.x1+(f.x2-f.x1)*t,py=f.y1+(f.y2-f.y1)*t,d=Math.hypot(px-x,py-y);if(d<=cfg.max)wave.reveals.push({x:px,y:py,d,shown:false,fake:true});}state.fakeCount++;});}
 state.waves.push(wave);state.lastSound={x,y,kind,time:now};hearSound(x,y,cfg.listen);return true;}
function eventRipple(g,weak=false){state.eventRipples.push({x:g.x,y:g.y,born:state.elapsed,life:.9,weak});}
function setGhostState(g,next){const prev=g.state;if(prev===next)return;g.state=next;if(prev==='patrol'&&next==='alert'){eventRipple(g);showTip('——它停了',1.2)}else if(prev==='alert'&&next==='chase'){eventRipple(g);g.outlineTimer=1}else if(prev==='chase'&&next==='confused')eventRipple(g);else if(prev==='confused'&&next==='patrol')eventRipple(g,true);}
function hearSound(x,y,range){state.ghosts.forEach(g=>{if(Math.hypot(g.x-x,g.y-y)<=range){setGhostState(g,'alert');g.target={x,y};g.timer=1.2;}})}
function throwStone(){if(!state||paused||state.dead||state.won)return;if(state.stones<=0){showTip('声石已尽。',1.4);return}const p=state.player,dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy)||1,travel=Math.min(250,d),tx=p.x+dx/d*travel,ty=p.y+dy/d*travel;state.stones--;state.thrown.push({x:p.x,y:p.y,sx:p.x,sy:p.y,tx,ty,t:0,hit:false,wall:false});syncHud();}
function pickupStone(){if(!state||paused||state.dead||state.won)return;let best=-1,bestD=28;state.resting.forEach((s,i)=>{const d=Math.hypot(s.x-state.player.x,s.y-state.player.y);if(d<=bestD){best=i;bestD=d}});if(best<0){showTip('附近没有声石。',1.2);return false}state.resting.splice(best,1);state.stones=Math.min(4,state.stones+1);showTip('拾回声石。',1.2);syncHud();return true;}
function isWater(x,y){return LEVELS[state.level].water.some(w=>x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h)}
function updatePlayer(dt){let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0),moving=dx||dy;if(moving){const n=Math.hypot(dx,dy);moveBody(state.player,dx/n*PLAYER_SPEED*dt,dy/n*PLAYER_SPEED*dt);state.moving+=dt;if(state.moving>=1.2){state.moving=0;if(!isWater(state.player.x,state.player.y))emitSound(state.player.x,state.player.y,'foot');}}else state.moving=0;}
function updateWaves(dt){for(const w of state.waves){w.age+=dt;w.r=Math.min(w.max,w.r+w.speed*dt);for(const p of w.reveals){if(!p.shown&&w.age>=p.d/w.speed+w.delay){p.shown=true;state.echoes.push({x:p.x,y:p.y,born:state.elapsed,life:4,fake:p.fake});}}}state.waves=state.waves.filter(w=>w.age<w.max/w.speed+w.delay+.15);state.echoes=state.echoes.filter(p=>state.elapsed-p.born<p.life);}
function updateThrown(dt){for(const s of state.thrown){s.t+=dt*3.4;if(!s.hit){const p=Math.min(1,s.t),nx=s.sx+(s.tx-s.sx)*p,ny=s.sy+(s.ty-s.sy)*p,dx=nx-s.x,dy=ny-s.y,dist=Math.hypot(dx,dy),steps=Math.max(1,Math.ceil(dist/8));for(let i=1;i<=steps;i++){const x=s.x+dx*i/steps,y=s.y+dy*i/steps;if(blocked(x,y,7)){const len=Math.hypot(dx,dy)||1;s.x=x-dx/len*10;s.y=y-dy/len*10;s.hit=true;s.wall=true;s.t=1;emitSound(x,y,'stone');showTip('声石撞在墙上。',1.2);break}if(i===steps){s.x=x;s.y=y}}if(p>=1&&!s.hit){s.x=s.tx;s.y=s.ty;s.hit=true;emitSound(s.tx,s.ty,'stone')}}}const landed=state.thrown.filter(s=>s.hit&&s.t>=1.45);landed.forEach(s=>state.resting.push({x:s.x,y:s.y}));state.thrown=state.thrown.filter(s=>!(s.hit&&s.t>=1.45));}
function toward(g,target,speed,dt){const dx=target.x-g.x,dy=target.y-g.y,d=Math.hypot(dx,dy)||1;moveBody(g,dx/d*speed*dt,dy/d*speed*dt,g.r);return d;}
function updateGhosts(dt){for(const g of state.ghosts){g.outlineTimer=Math.max(0,g.outlineTimer-dt);if(g.state==='patrol'){const t={x:g.path[g.pi][0],y:g.path[g.pi][1]};if(toward(g,t,62,dt)<16)g.pi=(g.pi+1)%g.path.length;const d=Math.hypot(g.x-state.player.x,g.y-state.player.y);if(d<300){g.nearTimer-=dt;if(g.nearTimer<=0){state.eventRipples.push({x:g.x,y:g.y,born:state.elapsed,life:.32,near:true});g.nearTimer=4}}else g.nearTimer=4;}else if(g.state==='alert'){g.timer-=dt;if(g.timer<=0)setGhostState(g,'chase');}else if(g.state==='chase'){if(toward(g,g.target,CHASE_SPEED,dt)<13){setGhostState(g,'confused');g.timer=3;g.seed+=1.7;}}else if(g.state==='confused'){g.timer-=dt;const t={x:g.target.x+Math.cos(g.seed+g.timer*2)*45,y:g.target.y+Math.sin(g.seed+g.timer*2)*45};toward(g,t,48,dt);if(g.timer<=0){setGhostState(g,'patrol');g.pi=(g.pi+1)%g.path.length;g.nearTimer=4;}}
  if((g.state==='chase'||g.state==='confused')&&Math.hypot(g.x-state.player.x,g.y-state.player.y)<g.r+state.player.r+4){lose();return;}}
 state.eventRipples=state.eventRipples.filter(r=>state.elapsed-r.born<r.life);
}
function updateItems(){for(const p of state.pickups)if(!p.got&&Math.hypot(p.x-state.player.x,p.y-state.player.y)<22){p.got=true;state.stones=Math.min(4,state.stones+1);showTip('拾得一枚声石。',1.5);syncHud();}for(const n of state.notes)if(!n.got&&Math.hypot(n.x-state.player.x,n.y-state.player.y)<22){n.got=true;const got=loadJSON(STORE.notes,[]);if(!got.includes(n.id)){got.push(n.id);saveJSON(STORE.notes,got)}openNote(n.id);return;}if(Math.hypot(LEVELS[state.level].goal.x-state.player.x,LEVELS[state.level].goal.y-state.player.y)<30)winLevel();}
function openNote(id){paused=true;$('#noteTitle').textContent=`纸钱·${['借喉','墙记','旧路','水纹','灯谎','收据'][id]}`;$('#noteText').textContent=NOTE_TEXTS[id];ui.note.classList.remove('hidden');syncHud();}
function lose(){if(state.dead)return;state.dead=true;paused=true;ui.result.classList.remove('hidden');$('#resultTitle').textContent='债鬼收声';$('#resultText').textContent=['你没有喊。黑暗替你喊了一声。','水把旧回声送了回来。','灯墙转过，你成了墙后那一声。'][state.level];$('#resultBtn').textContent='重走此进';setTimeout(()=>$('#resultBtn').disabled=false,350);}
function winLevel(){if(state.won)return;state.won=true;paused=true;const best=loadJSON(STORE.best,{}),key=String(state.level+1);if(!best[key]||state.elapsed<best[key]){best[key]=Math.round(state.elapsed*10)/10;saveJSON(STORE.best,best)}ui.result.classList.remove('hidden');if(state.level<2){$('#resultTitle').textContent='祠灯亮了';$('#resultText').textContent=['灯只照路，不照跟来的东西。','你踏出水时，回声还留在身后。'][state.level];$('#resultBtn').textContent='走入下一进';}else{const all=loadJSON(STORE.notes,[]).length===6,ending=all?'receipt':'lamp',total=['1','2','3'].reduce((sum,k)=>sum+(best[k]||0),0);state.clearEnding=ending;saveJSON(STORE.cleared,{ending,best:Math.round(total*10)/10});if(all)saveJSON(STORE.notes+'.receipt',true);$('#resultTitle').textContent=all?'收据':'灯下';$('#resultText').textContent=all?'今收守灵人声债六笔。哑者无声可还，故此债由听者代偿。你读到这里，账已转名。':'灯亮了。案上有几处灰白，像被人取走过什么。';$('#resultBtn').textContent='回到门外';}}
function showClear(){const best=loadJSON(STORE.best,{}),ending=state.clearEnding||loadJSON(STORE.cleared,{ending:'lamp'}).ending,total=['1','2','3'].reduce((sum,k)=>sum+(best[k]||0),0);ui.result.classList.add('hidden');ui.hud.classList.add('hidden');$('#clearTimes').textContent=`灵堂 ${best['1']||0}s · 水廊 ${best['2']||0}s · 灯阵 ${best['3']||0}s · 总计 ${Math.round(total*10)/10}s`;$('#clearNotes').textContent=`纸钱：${loadJSON(STORE.notes,[]).length}/6`;$('#clearEnding').textContent=`本次结局：${ending==='receipt'?'收据（隐藏）':'灯下'}`;ui.clear.classList.remove('hidden');}
function nextResult(){ui.result.classList.add('hidden');$('#resultBtn').disabled=false;if(state.dead){resetLevel(state.level);return}if(state.level<2)resetLevel(state.level+1);else showClear();}
function leaveClear(){ui.clear.classList.add('hidden');paused=true;refreshClearMark();ui.menu.classList.remove('hidden');}
function update(dt){if(!state||paused)return;state.elapsed+=dt;if(tipTimer>0&&(tipTimer-=dt)<=0)ui.tip.classList.remove('show');updatePlayer(dt);state.lamps.forEach(l=>l.a+=l.s*dt);updateThrown(dt);updateWaves(dt);updateGhosts(dt);updateItems();syncHud();}
function glow(x,y,r,color,a=.5){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color.replace(')',`,${a})`).replace('rgb','rgba'));g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function circle(x,y,r,color,a=1,line=1){ctx.globalAlpha=a;ctx.strokeStyle=color;ctx.lineWidth=line;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
function dangerInfo(){if(!state||!state.ghosts.length)return{distance:Infinity,alpha:0,interval:1.2};const distance=Math.min(...state.ghosts.map(g=>Math.hypot(g.x-state.player.x,g.y-state.player.y))),alpha=distance<220?(220-distance)/220*.35:0,interval=distance<100?.5:distance<220?.5+(distance-100)/120*.7:1.2;return{distance,alpha,interval};}
function drawWorld(t){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#050506';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.setTransform(view.s*dpr,0,0,view.s*dpr,view.x*dpr,view.y*dpr);ctx.fillStyle='#08080a';ctx.fillRect(0,0,W,H);if(!state)return;const lv=LEVELS[state.level];
 ctx.fillStyle='rgba(18,22,25,.45)';lv.water.forEach(w=>ctx.fillRect(w.x,w.y,w.w,w.h));
 const vignette=ctx.createRadialGradient(W/2,H/2,180,W/2,H/2,850);vignette.addColorStop(0,'rgba(0,0,0,0)');vignette.addColorStop(1,'rgba(0,0,0,.32)');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
 const danger=dangerInfo();if(danger.alpha>0){const dread=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.28,W/2,H/2,Math.hypot(W,H)*.55);dread.addColorStop(0,'rgba(80,0,0,0)');dread.addColorStop(.72,'rgba(80,0,0,0)');dread.addColorStop(1,`rgba(95,8,8,${danger.alpha})`);ctx.fillStyle=dread;ctx.fillRect(0,0,W,H);}
 ctx.globalCompositeOperation='lighter';
 for(const m of lv.marks){glow(m[0],m[1],18,'rgb(232,201,106)',.10);ctx.fillStyle='rgba(232,201,106,.32)';ctx.fillRect(m[0]-6,m[1]-1,12,2)}
 for(const p of state.pickups)if(!p.got){const a=.5+Math.sin(t*2+p.x)*.15;glow(p.x,p.y,22,'rgb(222,213,190)',a*.35);ctx.fillStyle=`rgba(222,213,190,${a})`;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();}
 for(const s of state.resting){const a=(.5+Math.sin(t*2+s.x)*.15)*.7;glow(s.x,s.y,22,'rgb(222,213,190)',a*.35);ctx.fillStyle=`rgba(222,213,190,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,3,0,7);ctx.fill();}
 for(const n of state.notes)if(!n.got){const a=.5+Math.sin(t*2.3+n.y)*.15;glow(n.x,n.y,24,'rgb(222,213,190)',a*.36);ctx.save();ctx.translate(n.x,n.y);ctx.rotate(.45);ctx.fillStyle=`rgba(222,213,190,${a})`;ctx.fillRect(-4,-5,8,10);ctx.restore();}
 const goal=lv.goal;glow(goal.x,goal.y,95,'rgb(125,166,255)',.32);ctx.fillStyle='#7da6ff';ctx.beginPath();ctx.arc(goal.x,goal.y,5,0,7);ctx.fill();
 state.lamps.forEach(l=>{const e=lampEnds(l);ctx.strokeStyle='rgba(88,34,34,.9)';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(e[0],e[1]);ctx.lineTo(e[2],e[3]);ctx.stroke();ctx.fillStyle='#7e3b32';ctx.beginPath();ctx.arc(l.x,l.y,6,0,7);ctx.fill();});
 for(const p of state.echoes){const age=state.elapsed-p.born,a=Math.max(0,1-age/p.life);ctx.fillStyle=p.fake?`rgba(205,116,70,${a*.75})`:`rgba(232,201,106,${a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.fake?1.7:2.25,0,7);ctx.fill();}
 for(const w of state.waves){const total=w.max/w.speed+w.delay;if(w.delay&&w.age<w.delay)continue;const a=.5*Math.max(0,1-w.age/total);if(loadJSON(STORE.motion,false)){circle(w.x,w.y,Math.min(w.max,42), '#e8c96a',a,1)}else circle(w.x,w.y,w.r,'#e8c96a',a,1.2);}
 for(const s of state.thrown){ctx.fillStyle='rgba(232,201,106,.7)';ctx.beginPath();ctx.arc(s.x,s.y,3,0,7);ctx.fill();}
 drawGhosts(t);
 if(danger.distance<220){const phase=(state.elapsed%danger.interval)/danger.interval,r=loadJSON(STORE.motion,false)?66:40+phase*50,a=.28*(1-phase);circle(state.player.x,state.player.y,r,'#8a2020',a,1.2);}
 glow(state.player.x,state.player.y,34,'rgb(245,240,224)',.22);ctx.fillStyle='#f5f0e0';ctx.beginPath();ctx.arc(state.player.x,state.player.y,6,0,7);ctx.fill();circle(state.player.x,state.player.y,10+Math.sin(t*2)*2,'#f5f0e0',.34,1);
 ctx.globalCompositeOperation='source-over';}
function drawGhosts(t){for(const r of state.eventRipples){const phase=(state.elapsed-r.born)/r.life;if(r.near){circle(r.x,r.y,60,'#8a2020',.15*(1-phase),1)}else{const radius=loadJSON(STORE.motion,false)?175:90+phase*170;circle(r.x,r.y,radius,'#c0392b',(r.weak?.45:.7)*(1-phase),1.8)}}for(const g of state.ghosts){if(g.state==='chase'){const phase=((state.elapsed+g.seed)%.6)/.6,r=loadJSON(STORE.motion,false)?40:8+phase*42;circle(g.x,g.y,r,'#c0392b',.62,1.5);}if(g.state==='alert'){const target=g.target||g,ang=Math.atan2(target.y-g.y,target.x-g.x);ctx.strokeStyle='rgba(192,57,43,.72)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(g.x+Math.cos(ang)*18,g.y+Math.sin(ang)*18);ctx.lineTo(g.x+Math.cos(ang)*35,g.y+Math.sin(ang)*35);ctx.stroke();}if(g.state==='chase'||g.outlineTimer>0){ctx.strokeStyle=`rgba(58,13,13,${g.state==='chase'?.9:g.outlineTimer})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(g.x,g.y,13,0,7);ctx.stroke();}}}
function frame(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);drawWorld(now/1000);requestAnimationFrame(frame)}
function screenToWorld(cx,cy){return{x:(cx-view.x)/view.s,y:(cy-view.y)/view.s}}
addEventListener('resize',resize);addEventListener('keydown',e=>{keys[e.code]=true;if(!state||paused)return;if(e.code==='Space'){e.preventDefault();throwStone()}if(e.code==='KeyJ')emitSound(state.player.x,state.player.y,'tap');if(e.code==='KeyK')emitSound(state.player.x,state.player.y,'howl');if(e.code==='KeyQ')pickupStone();});addEventListener('keyup',e=>keys[e.code]=false);canvas.addEventListener('mousemove',e=>{mouse=screenToWorld(e.clientX,e.clientY)});canvas.addEventListener('mousedown',e=>{mouse=screenToWorld(e.clientX,e.clientY);if(e.button===0)emitSound(state?.player.x,state?.player.y,'tap');if(e.button===2)emitSound(state?.player.x,state?.player.y,'howl');});canvas.addEventListener('contextmenu',e=>e.preventDefault());
$('#startBtn').onclick=startGame;$('#resultBtn').onclick=nextResult;$('#clearBtn').onclick=leaveClear;$('#closeNote').onclick=()=>{ui.note.classList.add('hidden');paused=false;last=performance.now()};$('#motionBtn').onclick=()=>{const v=!loadJSON(STORE.motion,false);saveJSON(STORE.motion,v);$('#motionBtn').textContent=`减少动态：${v?'开':'关'}`};
$('#archiveBtn').onclick=()=>{const got=loadJSON(STORE.notes,[]),receipt=loadJSON(STORE.notes+'.receipt',false);$('#archiveList').innerHTML=NOTE_TEXTS.map((n,i)=>`<p>${got.includes(i)?`<b>${i+1}.</b> ${n}`:`${i+1}. 未拾得`}</p>`).join('')+(receipt?'<p><b>《收据》</b>已解锁。</p>':'');ui.archive.classList.remove('hidden')};$('#closeArchive').onclick=()=>ui.archive.classList.add('hidden');
resize();refreshClearMark();$('#motionBtn').textContent=`减少动态：${loadJSON(STORE.motion,false)?'开':'关'}`;requestAnimationFrame(frame);
window.__soundLoopTest={start:startGame,reset:resetLevel,emit:(kind,x,y)=>emitSound(x??state.player.x,y??state.player.y,kind),step:update,throwStone,pickupStone,win:winLevel,lose,showClear,refreshClearMark,snapshot:()=>state?JSON.parse(JSON.stringify({level:state.level,player:state.player,stones:state.stones,elapsed:state.elapsed,dead:state.dead,won:state.won,clearEnding:state.clearEnding,ghosts:state.ghosts,waves:state.waves.map(w=>({kind:w.kind,delay:w.delay,reveals:w.reveals.length,fakes:w.reveals.filter(p=>p.fake).length})),thrown:state.thrown,resting:state.resting,lastSound:state.lastSound,eventRipples:state.eventRipples,danger:dangerInfo(),echoes:state.echoes.length,fakeSegments:state.fakeCount,dpr,view})):null,levelSpec:()=>JSON.parse(JSON.stringify({start:LEVELS[state.level].start,goal:LEVELS[state.level].goal,walls:LEVELS[state.level].walls,water:LEVELS[state.level].water,lamps:state.lamps.map(l=>lampEnds(l))})),walkable:(x,y,r=9)=>!blocked(x,y,r),teleport:(x,y)=>{state.player.x=x;state.player.y=y},setMouse:(x,y)=>mouse={x,y},setGhost:(i,x,y)=>{state.ghosts[i].x=x;state.ghosts[i].y=y},transition:(i,next)=>setGhostState(state.ghosts[i],next)};
})();
</script>
