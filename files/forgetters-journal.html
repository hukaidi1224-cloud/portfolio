.wall-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.wall-summary{color:#aaa18e;font-size:14px}.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:25px}.zone{border:1px solid #454039;min-height:430px;padding:15px;position:relative;background:#191815}.zone h3{text-align:center;font-weight:400;color:#bca982;letter-spacing:.35em}.frag{position:relative;border:1px solid #585145;background:#24211c;margin:10px 0;padding:11px 12px;min-height:72px;z-index:2}.frag:before{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#aa8a52;left:50%;top:-4px}.frag.record{border-left:3px solid #8290a0}.frag.object{border-left:3px solid #a07855}.frag.testimony{border-left:3px solid #80765c}.frag b{font-size:14px;font-weight:400}.frag p{font-size:12px;color:#99907f;line-height:1.5;margin:7px 0 0}.empty{color:#504c44;text-align:center;margin-top:90px}.proofs{margin-top:25px;border-top:1px solid #454039;padding-top:20px}.proof{padding:13px 16px;border-left:2px solid var(--gold);background:#201d18;margin:10px 0;animation:goldline .9s ease}.proof b{color:#ceb57f}.proof span{color:#aaa18e;font-size:13px;line-height:1.6}@keyframes goldline{from{opacity:0;transform:scaleX(.6);transform-origin:left;box-shadow:0 0 18px #c39a4b}to{opacity:1;transform:scaleX(1)}}

function newDrop(){return{x:Math.random()*rainW,y:Math.random()*rainH,l:8+Math.random()*14,v:2.2+Math.random()*2.6}}
function resizeRain(){let d=devicePixelRatio||1;rainW=innerWidth;rainH=innerHeight;rainCanvas.width=rainW*d;rainCanvas.height=rainH*d;rainCanvas.style.width=rainW+"px";rainCanvas.style.height=rainH+"px";rainCtx.setTransform(d,0,0,d,0,0);rainDrops=Array.from({length:rainW<=760?65:130},newDrop);rainCanvas.dataset.dropCount=rainDrops.length}
function rainTick(){rainFrame=0;if(document.hidden||reduced.matches)return;rainClock+=.016;riseMix+=(riseTarget-riseMix)*.025;rainCtx.clearRect(0,0,rainW,rainH);rainCtx.strokeStyle="rgba(140,165,175,.28)";rainCtx.lineWidth=1;for(const d of rainDrops){let dir=1-1.4*riseMix,vx=.15-.75*riseMix+Math.sin(rainClock+d.y*.01)*.12;rainCtx.beginPath();rainCtx.moveTo(d.x,d.y);rainCtx.lineTo(d.x-vx*d.l*3,d.y-d.l*dir);rainCtx.stroke();d.y+=d.v*dir;d.x+=vx*1.5;if(d.y>rainH+30||d.y<-30||d.x<-30||d.x>rainW+30)Object.assign(d,newDrop(),{y:dir<0?rainH+10:-10})}rainFrame=requestAnimationFrame(rainTick)}
function ensureRain(){if(!rainFrame&&!document.hidden&&!reduced.matches)rainFrame=requestAnimationFrame(rainTick)}
function setWater(chapter){if(Number.isInteger(chapter))currentWater=Math.min(38,4+26*Math.min(chapter,23)/23+waterBonus);waterEl.style.height=currentWater.toFixed(1)+"vh";waterEl.dataset.level=currentWater.toFixed(1)}
function setStage(chapter){riseTarget=[2,16,23,24].includes(chapter)?1:0;rainCanvas.dataset.direction=riseTarget?"up":"down";setWater(chapter)}
addEventListener("resize",resizeRain);document.addEventListener("visibilitychange",()=>{if(document.hidden){if(rainFrame)cancelAnimationFrame(rainFrame);rainFrame=0}else ensureRain()});reduced.addEventListener?.("change",()=>{rainCtx.clearRect(0,0,rainW,rainH);ensureRain()});resizeRain();ensureRain();
const notes=[
"我在柜底摸到这本手记，封皮写着“不要相信明天的我”。屋里的木匣堵住去路，好像是昨夜的我故意留下的第一道题。",
"木匣后藏着一张车票，终点是柳渡镇。我对地名毫无印象，却记得小时候有人叫我“阿渡”。那声音很轻，像河面上的雨。",
"旧宅西墙有三根拉杆，旁边刻着月相。我的手比脑子更早认出顺序。门开时，墙上露出一幅照片：两个孩子站在洪水前。",
"照片背后写着：“沈知渡与妹妹知微，柳渡堤，七月十三。”我反复摸着前一个名字，手指却在“知微”上停了更久。",
"地板上的箭头只许向前，如同当年的水。我从被淹没的诊所带走一只药箱，却不记得是要救谁。手记边缘有一行紧促的小字：“先救她。”",
"镇志说，洪水那夜失踪两人，获救名单却只有“沈知渡”。我以为自己是那个幸存的哥哥，但照片上的男孩左眉有疤，我没有。",
"祠堂的踏板只给几息时间。门后放着一双小号雨靴和一枚断掉的发夹。我终于想起，那年先跑向诊所的人，不是哥哥。",
"手记里的字迹有两种。深色的字写“我会带你回家”，淡色的字反复模仿它。我一直借用哥哥的口吻，才能在每个醒来的早晨继续生活。",
"阁楼尽头藏着洪水日记。哥哥把药箱和我推上屋顶，自己回去救人。后来我把他的名字写在每一页顶端，写久了，竟以为那就是我。",
"医嘱夹在最后几页：记忆退行无法逆转，但身份不只是能被叫出的名字。我开始明白，这些机关不是哥哥的考验，是我留给自己的路标。",
"最后一页被墨涂满，只留下“我叫”两个字。如果我还记得照片、发夹与那双小雨靴，便不必再拿一段记忆去换答案。",
"天亮时，我合上手记。柳渡河还在窗外流，它不替任何人保存昨天。可我知道，曾有人把我送回岸上，而我愿意把这件事再写一遍。"];
const F=[
["m1","发烫的手心","证言","夜","我不是怕得发抖；手心一直烫着。"],["m2","七月十三","记录","夜","阿嬷把这个日子圈了三次。"],["m3","小号雨靴","信物","名","鞋底的泥印一路通向诊所。"],["m4","倒灌的地窖","证言","水","河水从地下先进了镇子。"],["m5","断发夹","信物","名","红线缠在断齿上，是妹妹的。"],["m6","报信的孩子","证言","夜","有人记得，是个孩子先喊“水进来了”。"],["m7","名单上的名字","记录","名","获救者只写了沈知渡。"],["m8","攥皱的半页纸","记录","名","“先救她”，纸边有撕裂的毛茬。"],["m9","药箱的重量","信物","水","里面不只是一个人的药。"],
["b1","左眉的疤","信物","名","照片里的哥哥左眉有一道旧疤。"],["b2","堤上还有一盏灯","证言","夜","洪水封住诊所时，二楼有灯在摇。"],["b3","失踪两人","记录","名","镇志留了两格，第二格被墨污吃掉。"],["b4","灯语","证言","夜","三短一长：屋里还有人。"],["b5","水流回旋","记录","水","堤口开裂后，水会把人送向诊所后墙。"],["b6","最后一块门板","信物","水","一头有少年的指印，另一头被推开。"],["b7","托付","证言","夜","“她发着烧。先把她送上去。”"],["b8","全镇的药","记录","水","退热药、止血带、碳粉；屋顶的伤者都在等。"],["b9","没说完的话","证言","名","沈知渡最后写到：“再救——”"],
["a1","退热药在第三层","记录","水","学徒慌时就数东西，因此记得药在哪。"],["a2","二楼举灯的人","证言","夜","我把灯举出窗，不是照自己，是要让堤上看见。"],["a3","报信孩子的脸","证言","名","她额头发烫，头上别着红发夹。"],["a4","记事本缺了一角","信物","名","缺口正好能和那张半页纸对上。"],["a5","紧促的字迹","记录","名","“先救她”是学徒记下的口令。"],["a6","左眉有疤的少年","证言","名","他踏进水里，先问药，再问我的名字。"],["a7","灯为谁而举","证言","夜","灯是为还没有被数进名单的人举的。"],["a8","水往下游","记录","水","漂流物最后在三十里外的旧渡口上岸。"],["a9","无名者的陈述","记录","名","我只记得别人叫我阿九，不记得家在哪。"],
["s1","七月十三的照片","信物","夜","三份讲述都把时间钉在同一夜。"],["s2","镇志空白","记录","名","失踪者第二格，等了八年还没有字。"],["s3","寄往下游的信","信物","水","信封只写了“旧渡口附近，阿九收”。"],
["j1","褪色的车票","信物","名","终点柳渡镇。没有人记得买票的人是谁。"],["j2","两种字迹","记录","名","深色的字写“我会带你回家”。淡色的字在模仿它。"],["j3","照片背面","信物","夜","沈知渡与妹妹知微，柳渡堤，七月十三。"],["j4","医嘱","记录","名","记忆退行无法逆转，但身份不只是能被叫出的名字。"],["j5","阁楼日记","证言","夜","哥哥把药箱和我推上屋顶，自己回去救人。"],["j6","写回来的名字","证言","名","笔画很生。但每一笔都是我的。"]];

const chapters=[
C(0,"雨脚","旧宅","水是从脚背上先知道的。凉的，像谁的手背贴上来。\n阿嬷的蒲扇停在半空：“七月十三的雨，下不过半夜。”","我把这句话攥在手心。后来跑过巷口时，它掉了。",[["蒲扇","m2","扇骨内侧刻着日子。"],["药碗","m1","碗边还留着退热药的苦味。"],["窗纸",null,"雨影倒着往上走。"]],{opts:[["“雨会停的。我去收衣裳。”","阿嬷笑了，又把药碗推近。你把这当成了一句安慰，因而记住了她的笑，没记住蒲扇为什么停下。"],["“下不过半夜——那水，也不会只下一夜。”","阿嬷没笑。她往地窖看了一眼，那一眼比话更重。",1,"m4"]]}),
C(0,"巷口","雨巷","水漫上脚背。巷口的狗不叫了，只朝诊所方向抽鼻子。","我记得我在跑。这个记忆像一枚钉，八年里一直钉在原处。",[["雨靴","m3","小号鞋尖指着逆水的方向。"],["巷石",null,"水面下有一串向北的泥印。"],["木门",null,"门后传来阿嬷的咳嗽。"]],{opts:[["转身敲响阿嬷的门。","她被你叫醒，披着衣服挨户敲门。因此有三户人早了一刻钟上堤，而你看见诊所的水又深了一寸。",1],["踩进水里，朝诊所跑。","鞋底向着水来的方向。这不像逃跑，但当时的你还不知道该怎么称呼它。",2,"m6"]]}),
C(0,"诊所","地窖","诊所的门开着。一缕混着药味的冷气从地窖往上爬。","你冲出门时撞断了发夹。红线留在门槛，替你记住了来路。",[["地窖","m4","水从砖缝里冒出，并非从大门涌入。"],["发夹","m5","一边的齿断在门槛下。"],["铜锁",null,"锁是开的，没有人破门。"]],{opts:[["蹲下摸水痕。","最深的水痕在地窖口。你终于确定：镇上还没人知道水已经从地下进来了。",2,"m4"],["去看门上的锁。","锁孔干净，门不是被人打开的。你多记住了一个谜：今夜的水，比人先有钥匙。"]]}),
C(0,"报信","柳渡堤","雨把呼吸压回胸口。堤上的人还在收缆绳，没人朝诊所看。","第一户灯亮起来，接着是第二户。全镇苏醒时，我却已经烧得听不见自己的声音。",[["铜锣","m6","锣面留着孩子小小的掌印。"],["灯笼",null,"更夫放下灯笼，去拉响警锣。"],["堤顶",null,"这里看不见诊所二楼的窗。"]],{opts:[["用尽力气喊：“地窖进水了！”","更夫先看你的脸，再看你身后逆水的脚印。他终于放下灯笼，敲响了锣。",2,"m6"],["沿着堤喊哥哥的名字。","你把“沈知渡”喊了一路。有人因此看见你，有人因此开始往高处走。私心也能变成警报，只是你很久不肯承认。",1]]}),
C(0,"名单","临时安置点","灯笼照着白纸。登记的人俯下身：“你是谁？”你的牙齿在打架。","笔尖落下。他写得很快，快到没人来得及看清一个人怎样变成另一个人。",[["登记簿","m7","墨还未干：获救，沈知渡。"],["药箱","m8","箱里夹着一张攥皱的半页纸。"],["手记",null,"淡色的笔正一遍遍描深色的字。"]],{opts:[["“我叫沈知渡。”","那是发烧的脑子里唯一剩下的名字。你不是想顶替他；你只是抓住了“我会带你回家”。",1,"m7"],["张开嘴，却只发出一个“知”字。","登记的人把你的沉默当成了虚弱，从药箱手记上抄下第一个名字。错误不总是一个人做出的。",0]]},[5,7]),
C(0,"屋顶","诊所屋顶","药箱先上来，然后是你。哥哥的手掌垫在箱角，被木刺划出一条血线。","雨幕里的背影越来越小。你记得自己先跑，却终于看见：你是朝着需要报信的地方跑。",[["药箱","m9","箱角的血不是你的。"],["手记",null,"深色的字写：我会带你回家。"],["屋檐",null,"下面有人举起了一盏灯。"]],{opts:[["我是先逃跑的人。","这句话你写了八年。它是真的，因为你的确先跑；它又是假的，因为你始终没写下跑向何处。",0,null,"contradict"],["我是先报信的人。","这不能让哥哥回来，也不能让你变得轻一些。但真相从来不是为了轻；它只负责让脚下有地。",3,"m6"]]} ,[6]),
C(1,"渡口","柳渡堤","水到膝盖了。先数人。阿婆一个，货郎一个。知微——知微呢。堤那头有一点灯。","我朝灯走。后来人们把这叫英雄，当时我只是个找不到妹妹的少年。",[["洪水照片","b1","左眉的疤在闪光下很清楚。"],["远灯","b2","三短一长，反复两次。"],["补页",null,"一张车票被夹在照片后面。"]],{opts:[["那只是照路的灯。","你沿着灯走，却把它当成无意义的背景。多年后，人们也把举灯的人留在了背景里。",0,null,"contradict"],["有人在用灯说话。","你看不懂那句话，但看懂了“还有人”。",2,"b2"]]},[2,3]),
C(1,"数人","水淹集市","市口的摊棚一间间倒下。我每扶起一个人，就把知微的名字重写一遍。","数字不会安慰人。但当水到胸口，它能让一双手知道下一个该拉谁。",[["镇志草稿","b3","“失踪两人”后的名字尚空。"],["空摊位",null,"秤码没收，人已经走了。"],["竹竿",null,"每道划痕都是一个被送上堤的人。"]],{opts:[["背起摔倒的阿婆。","她在你背上念另一个孩子的名字。你们都在找自己的人，你先成了她找到的那一个。",2],["把竹竿留给她，继续找知微。","阿婆用竹竿撑到了高处。你没有抛下她，只是把手里最好的东西留下，后来人们只记得你继续向前。",1]]}),
C(1,"堤灯","堤顶","灯每摇三下，停一下。这不是风，风不会犹豫。","诊所后墙的水在打旋。灯和脚印，指向了同一个地方。",[["灯的节奏","b4","三短一长，是药行的救火信号。"],["水纹","b5","漂浮物都被卷向诊所后墙。"],["泥印",null,"小号鞋印在这里断掉。"]],{opts:[["沿着灯的节奏走。","三短一长。每一次灯亮，你都知道自己没有走错。",2,"b4"],["循着小号雨靴的脚印走。","脚印在水深处消失。你第一次觉得，知微也许不是在离开诊所，而是曾跑向它。",2,"m3",null,"m3"]]}),
C(1,"门板","诊所一楼","门板浮起来时，我听见楼上有人数药瓶。一、二、三。他数得很慢。","我把知微的手交给一个陌生人。那一刻没有英雄，只有两个人都没松手。",[["门板","b6","门板只够托住一个人。"],["楼梯","b7","木扶手上留着托付时的指印。"],["药柜",null,"第三层已经被拉空。"]],{opts:[["“她发着烧。先救她。”","学徒立即在本子上写下这句话。你们之间只有一句话，却足够托住一个人。",3,"b7"],["把知微抱紧，独自往上走。","水的力气比你想得大。你还是把她送到了楼上，但你和学徒始终没有真正看清对方。",0,null,"half"]]}),
C(1,"药箱","诊所二楼","药箱打开着。退热药在第三层，止血带已湿了一半。","我把箱子推上屋顶。里面装的不只是知微的一夜，是所有还没被水数完的人。",[["药品清单","b8","九种药，只有退热药为一个人准备。"],["半页字条",null,"字迹向右倾，不像你的日记。"],["箱扣",null,"箱扣上有两种手指留下的泥。"]],{opts:[["把字条收进自己的日记。","后来的人会把它当成你的遗言。这并非恶意，只是爱比笔迹更容易被相信。",1,null,"contradict"],["把字条还给学徒。","他摇头：“是你说的，我只负责记。”它仍被夹进药箱，却第一次有了真正的作者。",3,"a4",null,"m8"]]},[4,8]),
C(1,"最后的话","洪水中","屋顶上有人接住药箱，又接住知微。我回过身，灯还亮着。","水折掉了最后半句话。门板却向下游去了，灯也上了屋顶。",[["日记末页","b9","“再救——”后只有水渍。"],["屋顶",null,"伤者的手把药箱向后传。"],["门板",null,"你把它推向那盏灯。"]],{opts:[["用最后一口气喊：“抓住门板！”","学徒抓住了。你最后看见的不是屋顶，而是他手里那盏灯还亮着。",3,"b6"],["追着知微的名字，把半句话喊完。","“再救——”水把后面的字带走。屋顶上没人听见你还想救谁，只记住了半句。",0,"b9","half"]]},[8]),
C(2,"第三层","诊所药柜","退热的药在第三层。往上数，第三层，不是往下。师傅说，慌时更要数。","水漫过第一层时，我还在数。这不是不怕，是我只有一种办法让手不抖。",[["药柜","a1","第三层的木边被指甲刮白。"],["钥匙",null,"师傅的钥匙挂在门边。"],["药碗",null,"给发烧孩子的碗空着。"]],{opts:[["继续数，把药装满箱子。","数到九时，你的手不抖了。后来药箱能救下屋顶的人，因为恐惧没有代替清单。",2,"a1"],["抱破被去堵楼下的门。","破被堵住门缝一会儿，也让你错过两瓶止血药。不是所有慌张都无用，只是有些代价当时看不见。",1]]}),
C(2,"二楼","诊所窗边","窗外的堤只剩一条黑线。一个额头发烫的孩子刚从楼下跑过，红发夹撞断了。","我把灯举出窗。风把灯芯压得很低，只要还亮着，堤上就不能说这里没人。",[["灯芯","a2","灯油只够再烧半个时辰。"],["红发夹","a3","孩子跑的方向与水流相反。"],["窗棂",null,"三短一长，你用救火信号摇灯。"]],{opts:[["把灯放在桌上，省着灯油。","屋里亮了一点，堤上却看不见。你因此看清药瓶标签，也更晚才听见远处人声。",0],["把灯举到窗外，让雨也看见。","灯会更快燃尽。但救援不是延长一盏灯的命，是让它被别人看见。",3,"a2"]]}),
C(2,"记事本","诊所桌边","有人在楼下喊：“她发着烧。先救她。”我的记性不好，听到重要的话就写。","纸角湿了。我撕下半页，夹进药箱。八年后，它会被当成另一个人的遗言。",[["记事本","a4","缺口留着三缕纤维。"],["铅笔","a5","字往右倾，每个横画都急着结束。"],["药箱",null,"半页纸正好塞进内盖。"]],{opts:[["把本子和半页纸对在一起。","纸纤维一根根合上。这句话的作者终于回来：不是下命令的人，是把命令记下的人。",3,"a4",null,"m8"],["只摸一摸半页纸上的字。","字迹很熟悉，因为你每天都用它记药名。可水声让你不敢承认，普通学徒的字也能留下八年。",1]]},[4]),
C(2,"来人","诊所楼梯","来人左眉有疤。他先把药箱推上来，再把一个发烧的孩子交给我。","他问我的名字。我说大家都叫我阿九。他点头，像真的把这两个字收好了。",[["少年","a6","左眉的疤在雨里发白。"],["交握的手",null,"两个人掌心都被木刺划伤。"],["孩子",null,"她一直念“知渡”。"]],{opts:[["“我只顾得了药箱。”","你抱紧药箱，孩子被屋顶上的人接住。记忆后来只留下一只箱子，人脸都沉进水里。",0,null,"contradict"],["接住她：“阿九。你可以这样叫我。”","陌生人交换了名字。一个人没能带着它回来，另一个人却在失去一切后还剩下它。",3,"a6"]]}),
C(2,"房梁","诊所屋脊","门板朝我漂来。推它的人忽然不见，水面只剩一道还未合拢的缝。","灯在我手里。我记得，举它不是等别人救我；是告诉别人，这里还有谁。",[["门板指印",null,"一道指印在末端停住。"],["灯","a7","最后一缕灯芯朝堤的方向斜。"],["房梁",null,"你的名字被刻在木头上。"]],{opts:[["只顾呼吸，不再回头。","人在水里先学会的是活着。你没有做错，只是后来的记忆里，那盏灯只剩下没有方向的光。",0],["回头记住那盏灯照向哪里。","它照向堤，照向能看见它的陌生人。你忘了回家的路，却记得自己曾经为谁指过路。",3,"a7",null,"b2"]]}),
C(2,"下游","旧渡口","我在三十里外的河滩醒来。有人问我从哪里来。我想了很久，只想起一盏灯。","档案把我写成“无名男子，十七岁许”。我在边上加了两个字：阿九。",[["河滩图","a8","漂流物的箭头都指向旧渡口。"],["陈述稿","a9","“阿九”是唯一由本人填上的字。"],["车票",null,"终点是柳渡镇，票面早已过期。"]],{opts:[["在陈述末尾写：“我是阿九。”","你不知道这是名字、排行，还是随口的呼唤。但人要先有一个能写下的地方，才能问路。",3,"a9"],["把那一栏留空。","空白也是真实的。你不肯用一个不确定的名字欺骗纸张，可纸张从此也没法替你回去。",0]]},[1]),
C(3,"木匣","旧宅柜底","三份讲述都读完了。最后一本，写的是我自己。柜底的木匣积着灰，封皮上的字比灰更重。","我把木匣抱上桌。今天的我无法替明天作证，但可以给她留下一条能再走一次的路。",[["木匣",null,"匣角有十几道开合留下的磨痕。"],["封皮",null,"“不要相信明天的我”，横画被反复描深。"],["钥匙",null,"钥匙系在柜脚，不是为了把答案藏起来。"]],{opts:[["用深色的字补上：“听哥哥的。”","这句话很稳，像有人替你按住了发抖的纸。明天醒来时，你也许会更容易相信它，只是你自己的声音又退后了一小步。",1,null,"dark"],["用淡色的字写：“明天的我也可以重新读。”","字很浅，笔尖中途还停了两次。它没有哥哥的句子那样可靠，但它第一次承认：明天醒来的人，也还是你。",1,null,"pale"]]},[0]),
C(3,"车票","旧宅抽屉","木匣后藏着一张车票。终点柳渡镇。我对地名毫无印象，却记得有人叫我阿渡。","车票没有告诉我是谁，只告诉我曾从哪里离开。有时回家的第一步，只是把一个地名念对。",[["车票","j1","票面褪色，终点“柳渡镇”仍可辨认。"],["站牌名",null,"柳渡的“渡”字被手指磨得发亮。"],["旧称",null,"阿渡可以是乳名，也可以是借来的名字。"]],{opts:[["“我在。”用哥哥的口吻应那声阿渡。","回应出口时，屋里像真的多了一个人。这声音帮你穿过了最难熬的早晨，也让别人放心。你知道它是借来的，却还不敢归还。",1,null,"dark"],["把那声呼唤放过去，低声念“柳渡”。","没有人回应，只有车票在手心响了一下。你还不能说出自己的名字，却开始练习不用哥哥的声音回头。",1,"j1","pale"]]},[1]),
C(3,"照片","旧宅西墙","墙后露出一幅照片。两个孩子站在洪水前。照片背后同时写着沈知渡和知微。","我把照片转回正面。左眉的疤属于他，停在“知微”上的手指属于我。",[["照片","j3","男孩左眉有疤，女孩头上别着发夹。"],["月相刻痕",null,"手比脑子更早认出了开门顺序。"],["照片背面",null,"两个名字之间有一个很浅的“与”。"]],{opts:[["手指停在“沈知渡”上，照着深色的字描一遍。","这个名字已经被你写得很熟。镇上的人会点头，档案也会接受，只有照片上那道左眉的疤始终不肯长回你的脸上。",1,null,"dark"],["手指停在“知微”上，不再跟着深色的笔画走。","这两个字很陌生，陌生得像照片里另一个孩子。可你的手指没有移开；有些事比记忆更早知道，也比名单更久。",1,"j3","pale"]]},[2,3]),
C(3,"两种字迹","旧宅书桌","手记里的字迹有两种。深色的字写“我会带你回家”，淡色的字反复模仿它。","今天的日记终于写完。无论用谁的声音，这一页都帮你活到了明天；只是两种活法会把你带向不同的笔尖。",[["深色字",null,"笔画稳，没有一次犹豫。"],["淡色字","j2","越到后来，模仿里越多了一点自己的停顿。"],["药箱",null,"边缘的“先救她”与两种字迹都不相同。"]],{opts:[["提起笔，用深色的字写：“今天也要带她回家。”","句子无可指摘，像一件穿了八年的外衣。它替你挡住追问，也替你获得镇上的点头；只是纸下那行淡色的字又模糊了一层。",1,null,"dark"],["换一支淡墨，写：“我不知道怎么回家。”","承认不知道比写一句正确的话更难。你被问了很久，也在雨靴和发夹旁停了很久。可落笔时，那行字比昨天清楚了一点。",1,"j2","pale"]]},[4,7]),
C(3,"阁楼","旧宅阁楼","阁楼尽头藏着洪水日记和一张医嘱。哥哥把药箱和我推上屋顶，自己回去救人。","纸页没有把哥哥还回来。它只把那场水从一个人的羞耻里放出来，让它重新成为许多人的那一夜。",[["阁楼日记","j5","补页的墨色比前文深，笔尖却是同一支。"],["医嘱","j4","“身份不只是能被叫出的名字。”"],["屋顶模型",null,"药箱和两个小人被推到最高处。"]],{opts:[["合上日记，用深色的字写：“我都记得。”","这是哥哥会写的话：短，稳，不给人担心的空隙。你因此能合上日记走下楼，却也把自己没能记住的那一部分再次关在了里面。",1,null,"dark"],["把日记读到末页，用淡色的字写：“我愿意再读。”","你没有突然想起一切。只是第一次允许记忆有缺口，也允许自己不用借一个已死之人的完整，才配把这一页读完。",1,"j5","pale"]]},[8,9]),
C(3,"名字","柳渡河岸","最后一页被墨涂满，只留下“我叫”两个字。天快亮了，河面不替任何人保存昨天。","天亮时，我合上手记。柳渡河还在窗外流。我先把自己的名字写了回来，然后才有力气去看镇志上另一格空白。",[["最后一页",null,"“我叫”后面的墨已经干了八年。"],["河面",null,"一片旧纸向下游漂，没有沉下去。"],["晨光",null,"淡色的字在天亮后反而更清楚。"]],{opts:[["用深色的字写完：“我叫沈知渡。”","这个名字能打开镇上每一扇门，也能让所有人安心。它替你活完了这一夜，却让你在笔画的终点忽然分不清：它替的究竟是哥哥，还是你自己。",1,null,"dark"],["换一支没用过的笔，写：“我叫沈知微。”","笔画很生，第二个字还写错了一次。你没有擦，只在旁边重写。每一笔都不像哥哥，每一笔却都是你的。",1,null,"pale"]]},[10,11]),
C(4,"写名","八年后·档案室","四份讲述摊在桌上。镇志翻到最末，失踪两人，第二个名字处是一团墨。","名字写下来，路就有了。至于信会不会有回音——柳渡河不替任何人保存昨天，但它往下游流。",[["空白","s2","笔尖落下前，空白也是档案的一部分。"],["河图","s3","旧渡口被铅笔圈了起来。"],["照片","s1","四份讲述终于有了同一个日期。"]],{opts:[["蘸墨，在空白处写下“阿九”。","笔画很少，写完却用了很久。我把信折好，封面写：“旧渡口附近，阿九收。”",4,"s2"]]},[9,11])
];

const KNOW={6:["“她在发烧。”你认出那双小雨靴。","另一份讲述的热度落进掌心。你没有只把灯看成灯，也没有只把孩子看成一个名字。",2,"b2",null,"m1"],7:["那个先报信的孩子，也该被数进去。","你把救人的数字多留了一格。这一格后来没进镇志，却进了你的日记。",2,"b3",null,"m6"],8:["半页纸的字往右倾，灯也向右倾。","你把两种倾斜放在一起，第一次想到举灯者和写字者可能是同一个人。",2,"b4",null,"m8"],9:["药箱很重——屋顶上等的不只知微。","你终于没把这一夜缩成自己家的生死。所以你把药箱交给学徒，再回头推门板。",2,"b7",null,"m9"],10:["“先救她”的纸边有撕口。","你看见纸从哪来，也因此不再领取这句话的署名。有人下令，有人记下，救人不必只属于一个人。",3,"b8",null,"m8"],11:["名单上的“沈知渡”仍然在屋顶。","你终于明白，自己的名字会替知微活下去。这不是安慰，却让最后的托付有了完整的句号。",3,"b9",null,"m7"],12:["药箱里是全镇的下半夜。","你照着另一份清单重数一遍，补上两卷止血带。未曾经历的记忆，也能在此刻帮手。",2,"a1",null,"b8"],13:["堤上有人看懂过这个节奏。","你摇出三短一长。灯光跨过水面，和哥哥日记里的那一点亮重合。",3,"a2",null,"b2"],14:["这纸角与药箱里的半页严丝合缝。","你不再只相信字的内容，也开始相信纸的边缘。被误认八年的笔迹，终于找到它的手。",3,"a5",null,"m8"],15:["哥哥曾把这个动作称为“托付”。","你接住孩子时没有问为什么是你。别人先把人交到你手上，你便先成为值得托付的人。",3,"a6",null,"b7"],16:["门板的另一头，曾在哥哥手里。","你抓紧木板。两份讲述在指印上交揥，他不是凭空消失，是把你推向了能活下去的水路。",3,"a7",null,"b6"],17:["镇志的第二格一直在等你。","你在陈述末尾写下去处。一个地方还不是家，但足以让八年后的信知道朝哪里走。",3,"a9",null,"b3"]};
KNOW[23]=["在“我叫”后面写：“我也在找回家的路。”","你想起无名者的陈述：他只记得别人叫他阿九。名字不是门牌，而是一个人愿意向回走时留下的脚印。你没有急着填空，先承认你们都还在路上。",2,"j6","pale","a9"];
const LINES=[{name:"灯芯",who:"妹妹的梦",intro:"有些名字，我找了八年。还有一些，到现在都没人写。"},{name:"渡口",who:"哥哥的补页",intro:"有一页日记，是后来补进去的。纸比其他页更薄，字也更深。"},{name:"下游",who:"无名者的陈述",intro:"档案里有一份没有名字的陈述。他把事物一件件数清，却没数出自己。"},{name:"手记",who:"她自己的手记",intro:"三份讲述都读完了。最后一本，写的是我自己。"},{name:"写名",who:"终章",intro:"四份讲述都已经说完。剩下的不是问题，是一格空白和一支笔。"}];
const ENDINGS={high:["高处","她在屋顶上发着烧，只记得一个名字。"],wick:["灯芯","她终于想起，自己是跑向什么的。"],list:["名单","他没有犹豫，也没能回头。"],ferry:["渡口","他最后一眼里，那盏灯还亮着。"],half:["半句","“再救——”这个字没能写完。"],down:["下游","他漂向下游，忘了要回去。"],memory:["记性","他忘了一切，只记得灯为谁而举。"],accepted:["受名","“沈知渡”替你活完了这一夜。可你开始分不清，替的是他还是你自己。"],writeback:["写回","你把自己的名字一笔一笔写了回来。字迹很生，但每一笔都是你的。"],allright:["三个都对了","三份讲述都真实。你把它们各自锁进正确的匣子，于是再也没有一条金线能跨过匣壁。人人都对，除了事实。"],write:["写名","名字写下来，路就有了。信已寄出，柳渡河往下游流。"]};
const V6_NOTES=[
"柜底这本手记的封皮写着：不要相信明天的我。木匣把去路堵住，像昨夜的我留下的第一笔欠账，钥匙系在柜脚，说明她并不想赖账。",
"木匣后的车票以柳渡镇为终点，票面没有乘客的名字。有人叫我阿渡，那声音在雨里没有凭据，我先把它收下，像收下一张还没到期的票。",
"西墙的三根拉杆旁刻着月相，手在我想起之前先把顺序做完。墙后的照片有两个孩子，洪水站在他们身后，当时还没有开始数人。",
"照片背面写着沈知渡与妹妹知微，柳渡堤，七月十三。两个名字中间的“与”很浅，我摸前一个名字，手指却在后一个上停得更久。",
"诊所的地板只许向前，水也遵守这条规矩，直到它拿到地窖的钥匙。我带走药箱，手记边缘写着“先救她”，字很急，纸却把它保管了八年。",
"镇志将洪水那夜记为失踪两人，获救一人，获救栏只有沈知渡。照片上的男孩左眉有疤，我没有，纸面的账因此少了一道能对上的刻痕。",
"祠堂门后的雨靴小一号，发夹断了一排齿，这两件东西比我早一步认出它们的主人。那年先跑向诊所的人不是哥哥，这句话先记下，原因以后再对。",
"手记里有两种字迹，深色的写“我会带你回家”，淡色的学着它的笔顺。模仿写久了，停顿里开始长出别的东西，那部分还没有名字。",
"阁楼的洪水日记把药箱、妹妹和屋顶记在同一页，哥哥在下一行回去救人，没有再回来。后来我在每页顶端写他的名字，写得多了，账本就把我算成了他。",
"医嘱说记忆退行无法逆转，身份不只是能被叫出的名字。医生的字很平，没有为这句话加重，我把它当作一条可以多用几年的规矩。",
"最后一页的墨只留下“我叫”，后面的空白已经干了八年。照片、发夹和雨靴都在桌上，它们各占一格，不再要求我拿另一段记忆换答案。",
"天亮时我合上手记，柳渡河还在窗外流，河不替人保存昨天，只负责把水送往下游。有人曾把我送回岸上，这笔账我愿意再写一遍。"];
const V6_END={high:"名单上少一个人的夜，屋顶上多了一个。这笔账八年后才对上。",wick:"她跑在水来的方向上，锣先替她把话说完。这根灯芯没有灭。",list:"他把人数完，名单却没把他数回来。账本留了一格。",ferry:"门板过去了，人没有。那盏灯亮到最后，替他在渡口对了账。",half:"水拿走“再救——”的后半句，日记将空白保留下来。这是一笔坏账。",down:"档案记他十七岁许，漂到下游，去处不明。纸比他多记住一条路。",memory:"他忘了镇子和家，灯却还朝堤的方向亮。记性少了，账没有少。",accepted:"沈知渡替她活完这一夜，镇上人都认这个名字。只有她开始分不清，代签的是谁。",writeback:"字迹很生，第二个字还重写了一次。每一笔都不像哥哥。每一笔都是她的。",allright:"三份讲述各自锁进正确的匣子，金线再也跨不过匣壁。人人都对，除了事实。",write:"阿九只有两画，写完却用了很久。信已折好，河水负责把路送往下游。"};
notes.splice(0,notes.length,...V6_NOTES);Object.entries(V6_END).forEach(([k,v])=>ENDINGS[k][1]=v);
const V6_OPEN=[
"水先到脚背，凉意贴了一会儿，便穿过脚缝往屋里高处走。水往高处走不合规矩，雨下到第七天，镇上不合规矩的事已经够写半页。\n阿嬷坐在门槛里摇蒲扇，扇面四尾鱼游了四代人，今夜正往上游去。“七月十三的雨，下不过半夜。”她把话放回屋里，像把盐放回罐子。\n心魔：先别开口。说出口的东西就归你了。",
"巷口的狗不叫了，它比人先知道水的事，只把鼻子从门缝里收回去。小号雨靴涉进水里，鞋尖和水来的方向顶在一起，谁也没有让路。\n我记得自己在跑，这个记忆八年里没有生锈，也没有挪过位置。阿嬷的咳嗽留在木门后，诊所的药味在北面，两边各记一笔。",
"诊所大门开着，铜锁干净，地窖的水却已经从砖缝里冒出来。水拿到了钥匙，没有人给它，它照着自己的规矩把药味一层层送上楼。\n我踏进去时，发夹的断齿卡在门槛下，红线留在原处替我记路，比我自己可靠。水痕、锁孔和发夹各占一格，账还没对完。\n心魔：别回头。回头就要承认你来过。",
"堤上的人还在收缆绳，雨把喊声压得很低，一句话只能走过半条巷。铜锣挂在更楼下，它比人可靠，一旦响起来，便没有把声音收回去的规矩。\n我的手掌拍在锣面上，小一号的指印留在铜锈里。灯笼被放下，第一户人开门，然后是第二户，镇子开始按户数人。",
"临时安置点的白纸铺在桌上，获救一栏只留了一行，笔尖沾满墨后等着一个名字。纸不问那个名字答不答应，它只负责把墨留住。\n我发着烧，牙齿在打架，脑子里只剩下深色的“我会带你回家”。登记的人俯下身，他问得很慢，笔落得很快。\n心魔：给他一个名字。他不会问第二次。",
"药箱先上屋顶，然后是我，箱角从哥哥手掌里刮过，木头替他疼了一下。箱子里的药各有去处，只有人在那时还不知道自己会被水送去哪里。\n我趴在瓦上看他回头，雨幕把背影越记越小。八年里我只记自己先跑，没记跑过谁，也没记我跑向需要报信的地方。",
"堤口的水到了膝盖，沈知渡先数人，阿婆一个，货郎一个，妹妹的位置空着。数目比名字可靠，名字会被水冲走，数目只会少一个。\n堤那头有一点灯，三短一长，反复两次。他还不知道灯在说什么，脚已经朝那里走，像账本自己去找少掉的那一项。\n心魔：不要数她。数了就要找到。",
"集市的摊棚一间间倒下，竹竿上每道划痕都代替一个被送上堤的人。划痕比人声整齐，因为人会反复喊同一个名字，竹子每次只认一刀。\n他每扶起一个人，就在心里把知微重写一遍。这道账他后来对了八年，划痕一道没少，只是最后没有人替他本人补上一刀。",
"堤顶的灯摇三下，停一下，再摇三下，这是药行救火时留下的规矩。灯不会犹豫，犹豫的是举灯的手，灯芯只按油量做事。\n诊所后墙的水流正在回旋，泥印在深处断掉，两条路都指向同一扇窗。规矩比勇敢早到一步，因此先救了人。",
"诊所一楼的门板浮起来，长度只够托住一个人，楼上有人正按一、二、三数药瓶。木板没有选谁，它只把自己最宽的一面翻上来。\n沈知渡把妹妹的手交给学徒，两个人都没有松手，这件事当时没有名字。如果一定要写进账本，只能记：一人，一人。",
"药箱在二楼打开，清单有九种药，八种要送去屋顶给别人，第九种才给发烧的孩子留下。账要分开记，否则一只箱子会被误会成一个人的命。\n半页纸夹在内盖，“先救她”向右倾，和哥哥日记的字迹不同。纸边有撕口，它已经把来处写在身上，只等另一角来对。\n心魔：收下它。死人的字比活人好用。",
"屋顶上的人接住药箱，再接住知微，手一只只往后传，没有谁能腾出第三只手。门板浮在水上，它还没有记下最后一组指印。\n沈知渡回过身，日记写到“再救——”，水把后半句折走。账本从此多一笔坏账，空白就在破折处，没有人替它填。",
"药柜第三层放退热药，往上数，不是往下，这是师傅留的规矩。水漫过第一层时，瓶子仍按大小站好，比学徒的手更稳。\n他数到三，手就不抖了，规矩比勇敢有用，因为勇敢不会告诉他止血带剩两卷。他将数目写在箱盖，每一项各占一行。",
"二楼窗外的堤只剩一条黑线，灯油还够半个时辰，半个时辰够堤上的人抬头一次。灯芯不知道自己要救人，它只知道油还剩多少。\n学徒看见一个发烧的孩子从楼下跑过，红发夹撞断在门槛。他把灯举出窗，三短一长，将药行的规矩还给镇子。\n心魔：把灯放下。被看见就会被记住。",
"记事本摊在桌边，铅笔字往右倾，每一横都急着结束。楼下的人喊“她发着烧，先救她”，本子便把这句话收下，没有问说话的人叫什么。\n纸角湿了，学徒将半页撕下夹进药箱，缺口留下三缕纤维。八年后纤维一根根对上，这笔账就这样平了。",
"楼梯下先出现药箱，然后是一个左眉有疤的少年，他手里还有一个发烧的孩子。三件东西都沾着水，只有药箱知道自己下一步去屋顶。\n少年问学徒的名字，他说大家叫他阿九。少年将这个名字存在自己那里，后来人没能回来取，这笔存款至今有效。",
"门板朝房梁漂过来，末端有一组指印，像写到一半的字。推它的人沉下去，水面合拢时没有声音，只把那道缝从账面上抹平。\n学徒抓住门板，灯还在另一只手里，灯芯朝堤的方向斜着。他举灯不是等别人救他，是告诉还能数人的地方，这里少了几个。",
"旧渡口的河滩离柳渡三十里，漂流物的箭头都在图上指向这里。档案将上岸的人写成无名男子，十七岁许，纸比他多记住一条回去的路。\n只有“阿九”两个字是他自己填的，档案没有拒绝，也没有证明。他不记得从哪里来，只记得一盏灯朝堤上亮。",
"旧宅柜底的木匣积着八年的灰，封皮上“不要相信明天的我”被描深过很多遍。描的人不是在强调，是在跟明天的自己讨价还价。\n我把木匣抱上桌，匣角的磨痕先把开合次数报了出来。钥匙系在柜脚，说明昨天的我留了门，只是不肯替今天的我开。",
"抽屉里的车票以柳渡镇为终点，票面没有乘客名，“渡”字却被手指磨得发亮。一个地名能被磨亮，说明有人一遍遍确认自己要从哪里回来。\n有人在记忆里叫我阿渡，声音很轻，没有姓氏和日期作凭据。我先把车票收下，票会过期，终点不会，这条规矩可以暂时使用。",
"西墙后的照片有两个孩子，男孩左眉有疤，女孩头上的发夹还没断。照片比人记得齐全，因为它只需要保管一次光。\n背面两个名字之间有一个很浅的“与”，笔画比别的字轻，像写的时候不敢用力。我的手指在两个名字上各停一次，时间不一样长。",
"书桌上的手记有两种字迹，深色的笔画稳，淡色的跟着它的顺序走。模仿久了，淡色字的停顿里长出了自己的东西，字典还没有给那东西命名。\n我把两支笔放在同一页旁边，深墨够镇上人辨认，淡墨只够我自己看清。今天的日记只有一行，却要先决定用谁的声音入账。",
"阁楼的补页墨色比前文深，笔尖是同一支，深不是用力，是后来的人写得慢。屋顶模型把药箱和两个小人托在最高处，纸上的哥哥却向下走。\n医嘱说记忆退行无法逆转，身份不只是能被叫出的名字。我把日记翻到末页，纸比我耐心，它等我八年，没有催第二次。",
"最后一页只剩“我叫”，后面的墨干了八年，河面将一片旧纸送往下游。晨光落在淡色的字上，字反而比夜里清楚，天亮也有自己的记账方法。\n我把笔放在空白上，名字和回家的路都没有自己出现。此前每一页都在教我借别人的字活下去，这一页只负责等我落笔。",

"镇志记失踪两人，获救栏只有知渡。照片上的疤没长在我眉上，账便对不起来。",
"雨靴小一号，发夹断了齿。它们比我早认出主人，也证明当年先跑向诊所的人不是哥哥。",
"深色字写带我回家，淡色字跟着它。跟得久了，停顿里开始多出自己的笔画。",
"阁楼日记记哥哥将药箱和我送上屋顶。后来我反复写他的名字，账本便把我算成了他。",
"医嘱记忆退行不可逆，身份不只是名字。字很平，像一条还能多用几年的规矩。",
"末页只留下我叫，空白已经干了八年。照片和雨靴各占一格，不再要我用别人的记忆换答案。",
"天亮时河还往下游流。它不保存昨天，只把路留下，这笔账我愿意重写一遍。");
Object.assign(ENDINGS,{high:[ENDINGS.high[0],"名单少一人，屋顶多一人。这笔账八年后才对上。"],wick:[ENDINGS.wick[0],"她跑向水来的方向，锣先把话说完。灯芯没灭。"],list:[ENDINGS.list[0],"他数完了人，名单没数回他。账本留了一格。"],ferry:[ENDINGS.ferry[0],"门板过去，人没有。灯在渡口替他对账。"],half:[ENDINGS.half[0],"水拿走后半句，日记保留空白。这是一笔坏账。"],down:[ENDINGS.down[0],"档案记十七岁许，去处不明。纸比他多记一条路。"],memory:[ENDINGS.memory[0],"他忘了家，灯还朝堤上亮。记性少了，账没少。"],accepted:[ENDINGS.accepted[0],"知渡替她活完这一夜，只有她开始分不清代签的人。"],writeback:[ENDINGS.writeback[0],"第二个字重写一次。每一笔都不像哥哥，都是她的。"],allright:[ENDINGS.allright[0],"三份讲述各自入匣。人人都对，除了事实。"],write:[ENDINGS.write[0],"阿九只有两画，却写了很久。信已折好，河负责送路。"]});
const V6_KNOW_FEEDBACK={6:"雨靴和发烫的手心一起入账。灯不再只指方向，它在为一个未报名的孩子对数。",7:"你在竹竿上多刻一道。数字比镇志大一，报信的孩子因此先被数了进去。",8:"字与灯芯向同一边倾。这不是证明，只把举灯的人和落笔的手放进同一栏待查。",9:"你按全镇的清单交出药箱。妹妹的药在第九格，前八格从来不只属于沈家。",10:"纸边与本子对齐，你不再领取署名。一人下令，一人落笔，这笔账可以同属两人。",11:"屋顶的人将借这个名字活八年。这不抵消死亡，只让托付的去处完整一次。",12:"你按另一份清单重数，补上两卷止血带。别人的记忆没有成为你的，只提供正确数目。",13:"你按规矩摇灯，光与哥哥日记里的亮点合上。两份讲述由同一节奏代为签收。",14:"三缕纤维各回原位。纸边不讲人情，所以能把八年的署名错误退回落笔的手。",15:"你接住孩子，没有先问原因。另一人已把重量交来，手必须先完成这项交接。",16:"两份讲述在指印上合拢。他没有凭空消失，而是把能浮的木头和人一起送往下游。",17:"你在陈述末尾写阿九。两个字还不是家，却让档案多了可以查询的一格。",23:"你没有急着填空。名字暂时成为两个人向回走时共用的路标，而不是门牌。"};
Object.entries(V6_KNOW_FEEDBACK).forEach(([i,v])=>KNOW[i][1]=v);
const fresh=()=>({version:2,unlocked:0,line:0,chapter:0,phase:"open",scores:[0,0,0,0,0],inks:{dark:0,pale:0},flags:[],seenHot:[],endings:[],completed:[],lastEnding:null});
const legacy=legacySave();let p=load(PROGRESS,fresh),bag=load(FRAGMENTS,()=>({ids:[]}));
if(legacy){p.version=2;p.completed=(p.completed||[]).filter(i=>i<3);p.unlocked=Math.min(p.unlocked||0,3);p.endings=(p.endings||[]).filter(e=>e!=="write");p.inks={dark:0,pale:0};if(p.line>=3){p.line=3;p.chapter=18;p.phase="open"}save()}
let screen="title",feedback="";
function load(k,f){try{return Object.assign(f(),JSON.parse(localStorage.getItem(k))||{})}catch(e){return f()}}
function legacySave(){try{let x=JSON.parse(localStorage.getItem(PROGRESS));return !!x&&x.version!==2}catch(e){return false}}
function save(){localStorage.setItem(PROGRESS,JSON.stringify(p));localStorage.setItem(FRAGMENTS,JSON.stringify(bag))}
function has(id){return bag.ids.includes(id)}function gain(id){if(id&&!has(id)){bag.ids.push(id);save();toast("碎片已钉上墙："+FR[id].title)}}
function proofCount(){return PROOFS.filter(x=>has(x[0])&&has(x[1])).length}
function eligibleFinal(){return ["m6","b7","a9"].every(has)&&proofCount()>=6&&[0,1,2,3].every(x=>p.completed.includes(x))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const DISSOLVE={4:["一个名字","名单只记录被说出的名字"],7:["知微","每重写一次，这个名字就少一点归属"],15:["阿九","存下来的名字没有姓"],17:["阿九","这两个字由本人填写"],18:["明天的自己","她会读到这句话，但不一定认得写字的人"],20:["两个名字","照片背面的与字比它们更浅"],23:["名字","空白仍在等落笔的人"],24:["阿九","只有两画，但足够让信有去处"]};
const ANOMALY={0:["水往高处走","正往上游去"],2:["水拿到了钥匙"],8:["水流正在回旋"],16:["水面合拢"],23:["晨光落在淡色的字上"],24:["一团干透的墨"]};
function effectSource(raw,i){let s=String(raw),d=DISSOLVE[i];if(d&&s.includes(d[0]))s=s.replace(d[0],`[[${d[0]}|${d[1]}]]`);for(const word of ANOMALY[i]||[])if(s.includes(word))s=s.replace(word,`<em>${word}</em>`);return s}
function effectInline(raw){let out="",at=0,re=/\[\[([^|\]\n]+)\|([^\]\n]+)\]\]|<em>([^<\n]+)<\/em>/g,m;while((m=re.exec(raw))){out+=esc(raw.slice(at,m.index));out+=m[3]?`<em class="anomaly">${esc(m[3])}</em>`:`<span class="dissolve" tabindex="0" data-note="${esc(m[2])}">${esc(m[1])}</span>`;at=re.lastIndex}return out+esc(raw.slice(at))}
function proseBlock(raw,i){let source=effectSource(raw,i),seep=source.includes("<em>");let lines=source.split("\n").map(line=>line.startsWith("心魔：")?`<p class="voice">${effectInline(line.slice(3))}</p>`:effectInline(line));return `<div class="prose ${seep?'seep':''}">${lines.join("<br>")}</div>`}
function top(meta=""){return `<div class="top"><div class="brand">遗 忘 者 手 记</div><div class="meta">${meta}</div></div>`}
function toast(t){document.querySelector(".toast")?.remove();let e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2100)}
function title(){setStage(null);let any=p.chapter||p.completed.length;app.innerHTML=`<section class="screen active"><div class="frame">${top("完全版")}
<h1 class="title">遗忘者手记</h1><p class="subtitle">四个人讲过同一场水。没有一个人看见全部。</p>
<div class="quote">有些名字，我找了八年。还有一些，到现在都没人写。今夜，沈知微要把那场洪水和自己的八年，重新读一遍。</div>
<div class="actions"><button class="btn gold" data-a="routes">${any?"继续整理":"翻开手记"}</button><button class="btn" data-a="wall">碎片墙 · ${bag.ids.length}/36</button>${any?'<button class="btn" data-a="restart">重新开始</button>':''}<button class="btn danger" data-a="erase">擦除全部记忆</button></div>
<div class="archive">${Object.entries(ENDINGS).map(([k,v])=>`<span class="seal ${p.endings.includes(k)?'':'lost'}">${v[0]}</span>`).join("")}</div></div></section>`;bind()}
function routes(){setStage(null);let cards=LINES.map((l,i)=>{let open=i<=p.unlocked&&(i<4||eligibleFinal());let done=p.completed.includes(i);return `<div class="route ${open?'open':''}"><h3>${i===4?"终章":"周目"+(i+1)}《${l.name}》</h3><p>${l.who}<br>${done?"已讲完，可重读":open?"等待翻开":i===4?"需四线通关、关键碎片与 6 条互证":"上一份讲述尚未结束"}</p><button class="btn small" data-line="${i}" ${open?'':'disabled'}>${done?"重读":"进入"}</button></div>`}).join("");app.innerHTML=`<section class="screen active"><div class="frame">${top(`互证 ${proofCount()}/11`)}<div class="wall-head"><h2>四份讲述</h2><button class="btn small" data-a="wall">查看碎片墙</button></div><div class="route-grid">${cards}</div><div class="quote">选择不会告诉你对错。它只决定，你能看见故事的哪一面。</div><div class="actions"><button class="btn" data-a="title">合上档案</button></div></div></section>`;bind()}
function startLine(i){p.line=i;p.chapter=i*6;p.phase="open";p.scores[i]=0;if(i===3)p.inks={dark:0,pale:0};p.flags=p.flags.filter(x=>!x.startsWith("line"+i+":"));feedback="";save();screen="chapter";chapter()}
function chapter(){let c=chapters[p.chapter],lineNo=p.line<4?p.chapter-p.line*6+1:1,meta=p.line<4?`周目 ${p.line+1} · ${lineNo}/6`:`终章`;
setStage(p.chapter);
let quote=c.quote.length?`<div class="quote">${c.quote.map(i=>esc(notes[i])).join("<br><br>")}</div>`:"";
let body="";
if(p.phase==="open")body=`${quote}${proseBlock(c.open,p.chapter)}<div class="actions"><button class="btn gold" data-a="explore">走进${esc(c.scene)}</button></div>`;
if(p.phase==="explore"){body=`<div class="phase-note">点击物件调查 · 不必全部查看</div><div class="hotspots">${c.hot.map((h,j)=>{let key=`${p.chapter}:${j}`,seen=p.seenHot.includes(key),old=p.seenHot.some(x=>{let oc=chapters[+x.split(":")[0]],oj=+x.split(":")[1];return oc&&oc.hot[oj]&&oc.hot[oj][0]===h[0]&&+x.split(":")[0]<p.chapter});return `<button class="hot ${old?'seen':''}" data-hot="${j}"><b>${old?"· 再查 · ":""}${esc(h[0])}</b><span>${seen?esc(h[2]):"墨色浮在表面，等一只手揭开。"}</span></button>`}).join("")}</div><div class="actions"><button class="btn gold" data-a="choose">离开这些物件</button></div>`}
if(p.phase==="choice"){let opts=[...c.choice.opts];if(KNOW[p.chapter])opts.push(KNOW[p.chapter]);body=`${proseBlock(c.open.split("\n").slice(-1)[0],p.chapter)}<div class="choices">${opts.map((o,i)=>{let locked=o[5]&&!has(o[5]);return `<button class="choice ${o[5]?'knowledge':''} ${locked?'locked':''}" data-choice="${i}" ${locked?'disabled':''}>${esc(o[0])}${locked?`<br><small>这句话被墨遮住了</small>`:""}</button>`}).join("")}</div>`}
if(p.phase==="close")body=`<div class="feedback">${esc(feedback)}${p.flags.includes("gain:"+p.chapter)?'<div class="fragment-pop">一枚新碎片被钉上了墙。</div>':''}</div>${proseBlock(c.close,p.chapter)}<div class="actions"><button class="btn gold" data-a="next">${p.line<4&&((p.chapter+1)%6===0)?"结束这份讲述":p.line===4?"寄出这封信":"翻到下一章"}</button></div>`;
app.innerHTML=`<section class="screen active"><div class="frame">${top(meta)}<h1 class="chapter-title">${esc(c.title)}</h1><div class="scene">${esc(c.scene)}</div>${body}<div class="navrow"><button class="btn small" data-a="wall">碎片墙 ${bag.ids.length}/36</button><button class="btn small" data-a="routes">返回讲述目录</button></div></div></section>`;bind()}
function choose(i){let c=chapters[p.chapter],opts=[...c.choice.opts];if(KNOW[p.chapter])opts.push(KNOW[p.chapter]);let o=opts[i];feedback=o[1];waterBonus=Math.min(34,waterBonus+(o[3]?6:2));p.scores[p.line]+=o[2]||0;if(p.line===3&&(o[4]==="dark"||o[4]==="pale"))p.inks[o[4]]++;if(o[4])p.flags.push("line"+p.line+":"+o[4]);if(o[3]){gain(o[3]);p.flags.push("gain:"+p.chapter)}p.phase="close";save();chapter()}
function next(){if(p.line===4){gain("s3");finishLine("write");return}if((p.chapter+1)%6){p.chapter++;p.phase="open";feedback="";save();chapter()}else finishLine()}
function finishLine(forced){let i=p.line,key=forced;if(!key){if(i===0)key=p.scores[0]>=10?"wick":"high";if(i===1)key=p.flags.includes("line1:half")?"half":p.scores[1]>=12?"ferry":"list";if(i===2)key=p.scores[2]>=13?"memory":"down";if(i===3)key=p.inks.pale>p.inks.dark?"writeback":"accepted";let contradictions=p.flags.filter(x=>x.endsWith(":contradict")).length;if(i>=1&&i<3&&contradictions>=3)key="allright"}if(!p.endings.includes(key))p.endings.push(key);p.lastEnding=key;if(!p.completed.includes(i))p.completed.push(i);if(i<3)p.unlocked=Math.max(p.unlocked,i+1);if(i===3&&eligibleFinal())p.unlocked=4;save();ending()}
function ending(){setStage(null);let e=ENDINGS[p.lastEnding];app.innerHTML=`<section class="screen active"><div class="frame">${top("讲述已归档")}<div class="ending"><div class="meta">结 局</div><h2>《${e[0]}》</h2><p>${e[1]}</p><div class="actions"><button class="btn gold" data-a="routes">回到档案桌</button><button class="btn" data-a="wall">看看金线连到哪里</button></div></div></div></section>`;bind()}
function wall(){setStage(null);let zones=["夜","水","名"].map(z=>{let fs=bag.ids.map(id=>FR[id]).filter(f=>f&&f.zone===z);return `<section class="zone"><h3>${z}</h3>${fs.length?fs.map(f=>`<article class="frag ${f.type==='记录'?'record':f.type==='信物'?'object':'testimony'}"><b>${esc(f.title)} · ${f.type}</b><p>${esc(f.text)}</p></article>`).join(""):'<div class="empty">尚无碎片</div>'}</section>`}).join("");let proofs=PROOFS.filter(x=>has(x[0])&&has(x[1]));app.innerHTML=`<section class="screen active"><div class="frame">${top("跨周目保存")}<div class="wall-head"><h2>碎片墙</h2><div class="wall-summary">${bag.ids.length}/36 枚碎片 · ${proofs.length}/11 条互证</div></div><div class="zones">${zones}</div><div class="proofs"><h2>金线互证</h2>${proofs.length?proofs.map(x=>`<div class="proof"><b>${x[2]}</b><br><span>${esc(x[3])}</span></div>`).join(""):'<p class="meta">当两枚互补的碎片相遇，这里会出现一条金线。</p>'}</div><div class="actions"><button class="btn" data-a="back">返回</button></div></div></section>`;bind()}
function bind(){document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a));document.querySelectorAll("[data-line]").forEach(b=>b.onclick=()=>startLine(+b.dataset.line));document.querySelectorAll("[data-hot]").forEach(b=>b.onclick=()=>{let j=+b.dataset.hot,key=`${p.chapter}:${j}`,h=chapters[p.chapter].hot[j];if(!p.seenHot.includes(key))p.seenHot.push(key);gain(h[1]);save();chapter()});document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>choose(+b.dataset.choice))}
function act(a){if(a==="title"){screen="title";title()}if(a==="routes"){screen="routes";routes()}if(a==="wall"){screen="wall";wall()}if(a==="back"){p.line===4||p.chapter||p.completed.length?routes():title()}if(a==="explore"){p.phase="explore";save();chapter()}if(a==="choose"){p.phase="choice";save();chapter()}if(a==="next")next();if(a==="restart"&&confirm("重新开始仅清除周目进度，碎片墙会保留。继续吗？")){localStorage.removeItem(PROGRESS);p=fresh();title()}if(a==="erase"&&confirm("这将擦除周目进度和整面碎片墙。确定吗？")&&confirm("第二次确认：所有记忆都会消失，无法恢复。")){localStorage.removeItem(PROGRESS);localStorage.removeItem(FRAGMENTS);p=fresh();bag={ids:[]};title()}}
window.__FJC={chapters,FR,PROOFS,KNOW,ENDINGS,fresh,eligibleFinal,proofCount};title();
})();
</script>
</body></html>
