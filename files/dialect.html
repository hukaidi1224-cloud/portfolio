function renderStatement(st,where='stream'){
 const div=document.createElement('div');div.className='statement'+(state.invalid.has(st.id)?' invalid':'')+(st.reveal?' reveal-new':'');div.dataset.id=st.id;const sp=document.createElement('span');sp.className='speaker';sp.textContent=st.speaker+'：';div.append(sp);if(st.reveal)div.insertAdjacentHTML('beforeend','<span class="tag">指证</span> ');
 st.tokens.forEach(tok=>{if(tok.text){if(tok.fade&&state.alert>=60&&state.night>0){const f=document.createElement('span');f.className='faded';f.textContent=tok.text.slice(0,Math.max(1,Math.ceil(tok.text.length/2)))+'…';div.append(f)}else div.append(document.createTextNode(tok.text));return}const mode=wordState(tok.word,st),b=document.createElement('button');b.className='token '+mode;b.dataset.word=tok.word;b.textContent=tokenText(tok,st);b.title=mode==='known'?'点击查看这个已知词':'点击辨词';if(mode==='known')b.classList.add('recordable');b.onclick=()=>openWord(tok.word,st);div.append(b)});
 if(where==='stream'){const recorded=save.clues.some(c=>c.id===st.id),r=document.createElement('button');r.className='record-inline';r.dataset.record=st.id;r.textContent=recorded?'已录':'录';r.disabled=recorded;r.title=recorded?'该句已收入卷宗':'收录这句供词';r.onclick=e=>{e.stopPropagation();recordClue(st)};div.append(r)}return div;
}
function updateHeader(){const cap=state.night===0?40:100;state.alert=Math.max(0,Math.min(cap,state.alert));$('#alertText').textContent=state.alert+' / 100';$('#alertFill').style.width=state.alert+'%';$('#nightNo').textContent='第'+['一','二','三'][state.night]+'夜';$('#nightName').textContent=nightMeta[state.night].name;$('#nightRule').textContent=nightMeta[state.night].rule;$('#archiveCount').textContent=`(${Object.keys(save.dictionary).length}/${Object.keys(words).length}·${save.clues.length}线索)`}
function refreshStream(){const box=$('#stream');box.innerHTML='';state.history.filter(x=>x.night===state.night).forEach(x=>box.append(renderStatement(findStatement(x.id))));box.scrollTop=box.scrollHeight;updateHeader()}
function findStatement(id){return Object.values(statements).flat().find(s=>s.id===id)||{id,speaker:'记录',tokens:[T('供词已被翻供覆盖。')]}}
function adjustAlert(delta,reason){const before=state.alert;state.alert+=delta;updateHeader();$('#notice').innerHTML=`${reason}<br><b>警觉 ${delta>=0?'+':''}${state.alert-before}</b>`;if(state.alert>=60&&!state.flipped){toast('对方开始修饰措辞');refreshStream()}if(state.alert>=100&&state.night>0)flipTestimony()}
function advance(){if(state.ended)return;const list=statements['night'+(state.night+1)];if(state.index>=list.length){$('#endNightBtn').disabled=false;$('#notice').innerHTML='<span class="stamp">供词暂止</span><br>可先去档案页记录、指证，再结束本夜。';if(state.night===2)$('#endNightBtn').textContent='封卷并终局指证';return false}state.alert=Math.max(0,state.alert-3);const st=list[state.index++];state.history.push({id:st.id,night:state.night});$('#stream').append(renderStatement(st));$('#stream').scrollTop=$('#stream').scrollHeight;updateHeader();if(state.index>=list.length)$('#endNightBtn').disabled=false;return true}
function openWord(id,st){state.selectedWord=id;state.selectedStatement=st;const w=words[id],known=save.dictionary[id];$('#wordTitle').textContent=known?`已知词：${w.text}`:w.partial?`半知词：${w.partial}`:'暗词：'+'□'.repeat(Math.max(2,w.text.length));$('#wordContext').textContent='上下文：'+statementText(st);$('#guessChoices').innerHTML='';$('#wordActions').style.display='flex';$('#guessBtn').disabled=!!known;$('#wordModal').classList.add('open')}
function askWord(){const id=state.selectedWord,w=words[id];if(save.dictionary[id]){adjustAlert(18,'明知故问：'+w.text);closeWord();return}if(w.trap&&state.night===2){decode(id,w.meaning,true,true);adjustAlert(PRICE[w.sensitivity].alert,'对方给出了解释，也留意到你的方向');closeWord();return}decode(id,w.meaning,false,false);adjustAlert(PRICE[w.sensitivity].alert,`追问「${w.text}」：得到释义，也暴露了怀疑`);closeWord()}
function showGuess(){const w=words[state.selectedWord];$('#wordActions').style.display='none';const box=$('#guessChoices');box.innerHTML='';w.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>guessWord(c,i);box.append(b)})}
function guessWord(choice,index){const id=state.selectedWord,w=words[id],wrong=choice!==w.meaning;decode(id,choice,wrong,false);toast(`你记下了：〔${w.text}〕＝〔${choice}〕（待验证）。自己断的，不惊动任何人`);closeWord()}
function decode(id,meaning,wrong=false,suspect=false){save.dictionary[id]={meaning,wrong,suspect,display:words[id].text};if(wrong)state.wrongWords.add(id);persist();refreshStream()}
function closeWord(){$('#wordModal').classList.remove('open');$('#guessChoices').innerHTML='';$('#guessBtn').disabled=false}
function recordClue(st){if(save.clues.some(c=>c.id===st.id)){toast('该句已在卷宗');return false}const involved=st.tokens.filter(t=>t.word).map(t=>t.word);const gray=involved.some(id=>save.dictionary[id]?.wrong||save.dictionary[id]?.suspect);save.clues.push({id:st.id,text:statementText(st),speaker:st.speaker,gray,exposed:false,words:involved});persist();refreshStream();toast('已入卷宗');return true}
function flipTestimony(){state.flipped=true;state.invalid.add(...state.history.filter(x=>x.night===state.night).map(x=>x.id));save.clues=save.clues.map(c=>state.invalid.has(c.id)?{...c,gray:true,exposed:true}:c);Object.values(save.dictionary).forEach(d=>{if(d.suspect)d.exposed=true});const replacement={id:'flip-'+state.night,speaker:nightMeta[state.night].name,tokens:[T(state.night===1?'「方才记错了。货不曾经我手，日子、路线都作不得准。」':'「你所问的都是道听途说。黄鱼、北斗，我一概不认。」')]};statements['night'+(state.night+1)].push(replacement);state.history.push({id:replacement.id,night:state.night});persist();refreshStream();toast('警觉到顶：对方翻供，原供词作废')}
function renderArchive(){const dict=$('#dictionary');dict.innerHTML='';Object.entries(save.dictionary).forEach(([id,d])=>{const row=document.createElement('div');row.className='dict-row';row.innerHTML=`<b>${words[id].text}</b>　${d.meaning}${d.exposed?' 〔此人供词不可信〕':''}`;dict.append(row)});if(!dict.children.length)dict.innerHTML='<p class="hint">尚无破译词。</p>';
 const board=$('#clueBoard');board.innerHTML='';save.clues.forEach(c=>{const row=document.createElement('label');row.className='clue-row '+(c.exposed?'wrong':'');row.innerHTML=`<input type="checkbox" value="${c.id}"><span><b>${c.speaker}</b>　${c.text}${c.exposed?' 〔释义存疑〕':''}</span>`;board.append(row)});if(!board.children.length)board.innerHTML='<p class="hint">在审讯流中按句旁「录」，才会收入此处。记得太多，噪音也会留下。</p>';
 const hist=$('#history');hist.innerHTML='';state.history.forEach(x=>hist.append(renderStatement(findStatement(x.id),'history')))}
function accuse(){const ids=$$('#clueBoard input:checked').map(x=>x.value);if(ids.length!==2){toast('须恰好勾选两条线索');return false}const pair=contradictionPairs.find(p=>p.ids.every(id=>ids.includes(id)));const selected=save.clues.filter(c=>ids.includes(c.id));if(!pair){adjustAlert(25,'指证失败：这两条记录钉不成矛盾');toast('这两条记录钉不成矛盾，对面不为所动');return false}if(selected.some(c=>c.gray)){selected.filter(c=>c.gray).forEach(c=>{c.exposed=true;c.words.forEach(id=>{if(save.dictionary[id]?.wrong||save.dictionary[id]?.suspect)save.dictionary[id].exposed=true})});persist();renderArchive();adjustAlert(25,'指证失败：线索释义存疑');toast('线索里有〔释义存疑〕的记录，对方一句话就驳倒了');return false}if(state.successfulPairs.includes(pair.ids.join('|'))){toast('这组矛盾已经用过');return false}state.successfulPairs.push(pair.ids.join('|'));pair.unlock.forEach(id=>decode(id,words[id].meaning,false,false));state.alert=Math.max(0,state.alert-18);const revealId='reveal-'+state.successfulPairs.length,reveal={id:revealId,speaker:'指证记录',reveal:true,tokens:[T(pair.reveal)]};statements['night'+(state.night+1)].push(reveal);state.history.push({id:revealId,night:state.night});setPage('interrogate');refreshStream();toast('对质生效——对方说漏了（已加入对话流）');return true}
function endNight(){if(state.night===0){state.night=1;beginNight();return}if(state.night===1){state.night=2;beginNight();return}$('#finalModal').classList.add('open')}
function beginNight(){state.index=0;state.alert=0;state.flipped=false;state.startedAt=Date.now();$('#endNightBtn').disabled=true;$('#endNightBtn').textContent='结束本夜审讯';$('#notice').textContent=state.night===1?'牙人擅长避重就轻。本夜须在档案页完成至少一次跨夜指证。':'三人同堂。先生会故意留下半知词，等你亲口确认。';refreshStream()}
const endings={iron:`<h2>铁证</h2><span class="stamp">主犯·吴某</span><p>你把初三的船单、牙行的双柜账与那枚兰花私印摊在灯下。「北斗」是现编的话，「黄鱼」是为你准备的假人；真正的发号者，正是那个始终替别人解释方言的人。</p><p>吴先生终于不再辩。天快亮时，书办从他袖里拆出半枚回章，与黄册缺口严丝合缝。你没有听懂每一句话，却知道哪些话值得不去问。这一夜，沉默也成了证词。</p>`,doubt:`<h2>存疑</h2><span class="stamp">移送复审</span><p>你指认吴先生。路线、账簿与日期勉强能接在一起，可卷内仍夹着几条灰色的释义。「黄鱼」究竟是人是船，「北斗」是暗号还是日子，你已分不清哪一条是他的话，哪一条是自己的猜测。</p><p>案卷以「主犯存疑」移送。吴先生走过你面前时笑了一下：「大人听懂了好多话。」你低头看那些由自己填进去的字，第一次觉得白纸比黑字更可靠。</p>`,wrong:`<h2>冤案</h2><span class="stamp">结案·误</span><p>你指了一个会撑船或会算账的人。他们说过谎，也确实从这批盐里拿过好处；只是每一次转运的日子、每一条水旱路，都是另一只手写在黄册上的。</p><p>三日后，陈七或许掌柜在堂上画了押。吴先生作为「污点证人」被放出县署。那天夜里，有人在河嘴烧了一本账，火光照出一群白鹭。你终于听懂了这个词，却已没有人可以追问。</p>`};
function finish(target){$('#finalModal').classList.remove('open');const gray=save.clues.filter(c=>c.gray).length,good=state.successfulPairs.length>=3&&!state.flipped&&gray===0;const tier=target!=='wu'?'wrong':good?'iron':'doubt';if(!save.endings.includes(tier))save.endings.push(tier);const sec=Math.round((Date.now()-state.startedAt)/1000);save.fastest.night3=Math.min(save.fastest.night3||Infinity,sec);persist();state.ended=true;$('#endingBody').innerHTML=endings[tier]+`<p style="text-align:center"><button onclick="location.reload()">合卷重读</button></p>`;setPage('ending')}
function simulateStrategy(name){if(name==='chaotic')return {ending:'wrong',alert:105,flipped:true};if(name==='zeroAsk')return {ending:'doubt',alert:0,flipped:false};return {ending:'iron',alert:34,flipped:false}}
$$('.tab').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('#archiveBtn').onclick=()=>setPage('archive');$('#advanceBtn').onclick=advance;$('#endNightBtn').onclick=endNight;$('#askBtn').onclick=askWord;$('#guessBtn').onclick=showGuess;$$('[data-close]').forEach(b=>b.onclick=closeWord);$('#accuseBtn').onclick=accuse;$$('[data-final]').forEach(b=>b.onclick=()=>finish(b.dataset.final));$('#resetBtn').onclick=()=>{if(confirm('清空词典、线索与结局记录？')){localStorage.removeItem(SAVE_KEY);location.reload()}};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!$('#wordModal').classList.contains('open')&&!$('#finalModal').classList.contains('open')){e.preventDefault();advance()}});
$('#nightRule').textContent=nightMeta[0].rule;$('#notice').textContent='先听他说。你不必追问每一个不懂的词。';updateHeader();
window.__dialectTest={version:'2.2-inference',PRICE,words,statements,contradictionPairs,modified,getState:()=>({night:state.night,index:state.index,alert:state.alert,history:state.history.map(x=>({...x})),invalid:[...state.invalid],successfulPairs:[...state.successfulPairs],flipped:state.flipped}),getSave:()=>JSON.parse(JSON.stringify(save)),setAlert:n=>{state.alert=n;updateHeader();refreshStream()},setNight:n=>{state.night=n;beginNight()},advance,ask:(id,statementId)=>{state.selectedWord=id;state.selectedStatement=findStatement(statementId);askWord()},guess:(id,choice)=>{state.selectedWord=id;guessWord(choice,0)},decode,record:id=>recordClue(findStatement(id)),accusePair:(a,b)=>{setPage('archive');$$('#clueBoard input').forEach(x=>x.checked=[a,b].includes(x.value));return accuse()},flipTestimony,renderStatement:st=>renderStatement(st).textContent,statementText,simulateStrategy,resetForTest:()=>{save={dictionary:{},clues:[],endings:[],fastest:{}};state={night:0,index:0,alert:0,history:[],invalid:new Set(),selectedWord:null,selectedStatement:null,successfulPairs:[],wrongWords:new Set(),flipped:false,startedAt:Date.now(),ended:false};refreshStream()}};
})();
</script></body></html>
